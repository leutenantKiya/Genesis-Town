<style>
/* the boot screen (inline: it shows before the stylesheets arrive) */
#gt-boot{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#24305a 0%,#121733 55%,#0a0c1c 100%);color:#f4ecd8;font-family:"Pixelify Sans",system-ui,sans-serif;transition:opacity .6s ease,visibility 0s linear .6s}
#gt-boot.out{opacity:0;visibility:hidden}
.gt-boot__in{display:grid;justify-items:center;gap:14px;padding:24px;text-align:center;width:min(420px,88vw)}
.gt-boot__isle{width:min(220px,52vw);height:auto;image-rendering:pixelated;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.gt-boot__land{animation:gt-boot-bob 2.6s ease-in-out infinite}
.gt-boot__cloud{animation:gt-boot-cloud 9s linear infinite}
.gt-boot__drip{animation:gt-boot-drip 1.3s steps(4) infinite}
@keyframes gt-boot-bob{50%{transform:translateY(-3px)}}
@keyframes gt-boot-cloud{from{transform:translateX(-6px)}to{transform:translateX(56px)}}
@keyframes gt-boot-drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(5px);opacity:0}}
.gt-boot__logo{margin:4px 0 0;font:600 clamp(28px,6vw,44px)/1 "Pixelify Sans",system-ui,sans-serif;letter-spacing:.02em;color:#ffe9a8;text-shadow:0 3px 0 #b8742e,0 6px 0 rgba(0,0,0,.35)}
.gt-boot__bar{width:100%;height:16px;padding:3px;border:3px solid #f4ecd8;background:#1a1f3c;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.gt-boot__bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#00ec97 0 10px,#00b877 10px 12px)}
.gt-boot__step{margin:0;font-size:15px;color:#cfd8ff}
.gt-boot__tip{margin:6px 0 0;min-height:2.6em;font-size:14px;line-height:1.35;color:#9aa6d8}
.gt-boot__tip.in{animation:gt-boot-tip .5s ease-out}
@keyframes gt-boot-tip{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.gt-boot__land,.gt-boot__cloud,.gt-boot__drip,.gt-boot__tip.in{animation:none}}
</style>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/chain.css">
<link rel="stylesheet" href="css/settings.css">

<body>
<!-- the boot screen: drawn before anything else loads (styles inline here), it follows the real loading (the page,
     the 2.5D kit's files, the first frame) through window.GT_BOOT, and fades out when the world is on screen -->
<div id="gt-boot" role="status" aria-live="polite">
  <div class="gt-boot__in">
    <svg class="gt-boot__isle" viewBox="0 0 64 48" shape-rendering="crispEdges" aria-hidden="true">
      <g class="gt-boot__cloud"><rect x="2" y="6" width="10" height="3" fill="#fff"/><rect x="4" y="4" width="5" height="2" fill="#fff"/></g>
      <g class="gt-boot__land">
        <rect x="14" y="26" width="36" height="4" fill="#5fae3e"/><rect x="12" y="28" width="40" height="3" fill="#4c9a33"/>
        <rect x="14" y="31" width="36" height="4" fill="#8a5a30"/><rect x="18" y="35" width="28" height="3" fill="#6e4424"/>
        <rect x="23" y="38" width="18" height="3" fill="#5a3a1e"/><rect x="28" y="41" width="8" height="2" fill="#4a2e18"/>
        <rect x="20" y="17" width="12" height="9" fill="#f2e2c4"/><rect x="18" y="13" width="16" height="4" fill="#c8503c"/><rect x="20" y="11" width="12" height="2" fill="#e0705a"/>
        <rect x="25" y="20" width="3" height="6" fill="#8a5a30"/><rect x="21" y="19" width="3" height="3" fill="#7cc8f0"/><rect x="29" y="19" width="2" height="2" fill="#7cc8f0"/>
        <rect x="40" y="20" width="2" height="6" fill="#6a4020"/><rect x="36" y="12" width="10" height="9" fill="#3f8a3a"/><rect x="38" y="10" width="6" height="3" fill="#56a64a"/>
        <rect x="47" y="24" width="2" height="2" fill="#f0d048"/><rect x="16" y="24" width="2" height="2" fill="#e85a6a"/>
        <rect x="34" y="43" width="2" height="4" fill="#9ad8ff" class="gt-boot__drip"/>
      </g>
    </svg>
    <h1 class="gt-boot__logo">Genesis Town</h1>
    <div class="gt-boot__bar" aria-hidden="true"><i></i></div>
    <p class="gt-boot__step" id="gt-boot-step">Loading the town…</p>
    <p class="gt-boot__tip" id="gt-boot-tip"></p>
  </div>
</div>
<script>
(function () {
  var id = /[?&]lang=id\b/.test(location.search) || (function () { try { return localStorage.getItem('gt.lang') === 'id'; } catch (e) { return false; } })();
  var TIPS = id ? ['Tips: berdiri di portal beberapa detik untuk pindah dunia.', 'Tips: jual saat stok pedagang menipis, harganya naik.', 'Tips: pegang Cangkul di dekat kebun untuk melihat kotak hijau.', 'Tips: Q dan E memutar kamera 2.5D.', 'Tips: bangunan di Homeland tetap menghasilkan saat kamu pergi.']
    : ['Tip: stand in a portal for a few seconds to travel.', 'Tip: sell when a merchant’s stock runs low, the price climbs.', 'Tip: hold the Hoe by your farm to see where you can till.', 'Tip: Q and E turn the 2.5D camera.', 'Tip: Homeland buildings keep producing while you are away.'];
  var el = document.getElementById('gt-boot'), bar = el.querySelector('.gt-boot__bar i'), step = document.getElementById('gt-boot-step'), tip = document.getElementById('gt-boot-tip');
  var shown = 0, want = 0.08, t0 = Date.now(), ended = false, ti = Math.floor(Math.random() * TIPS.length);
  function paint() { shown += (want - shown) * 0.12; bar.style.width = (shown * 100).toFixed(1) + '%'; if (!ended || shown < 0.995) requestAnimationFrame(paint); }
  requestAnimationFrame(paint);
  tip.textContent = TIPS[ti];
  var tipT = setInterval(function () { ti = (ti + 1) % TIPS.length; tip.classList.remove('in'); void tip.offsetWidth; tip.textContent = TIPS[ti]; tip.classList.add('in'); }, 3200);
  window.GT_BOOT = {
    set: function (frac, label) { if (ended) return; want = Math.max(want, Math.min(0.98, frac)); if (label) step.textContent = label; },
    done: function () {
      if (ended) return; ended = true; want = 1; step.textContent = id ? 'Siap!' : 'Ready!';
      var wait = Math.max(0, 900 - (Date.now() - t0)); // a flash of the screen reads as a glitch: stay up a moment at least
      setTimeout(function () { el.classList.add('out'); clearInterval(tipT); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650); }, wait + 550); // the bar fills first
    },
    zh: id
  };
  window.addEventListener('load', function () { GT_BOOT.set(0.35, id ? 'Membangun desa…' : 'Building the village…'); });
  setTimeout(function () { GT_BOOT.done(); }, 25000); // never stuck: the game shows whatever is ready
})();
</script>
<main id="app">
  <div class="shell">
    <div class="brand"><b>Genesis Town</b></div>
    <div class="hud" id="hud">
      <div class="cell loc"><span class="lbl">LOKASI</span><span class="val" id="loc">Blok (0,0)</span></div>
      <div class="cell coinc"><span class="lbl">KOIN</span><span class="val"><i class="coin"></i><span id="coins">500</span></span></div>
      <div class="cell"><span class="lbl">WAKTU</span><span class="val"><i class="sm" id="sm"></i><span id="clock">08:00 H1</span></span></div>
      <div class="cell seedc"><span class="lbl">SEED</span><span class="val" id="seed">0</span></div>
      <div class="cell"><span class="lbl">PERAN</span><span class="val"><span class="badge" id="role">WARGA</span> <span class="clantag" id="clan"></span></span></div>
      <div class="acts" id="acts">
        <button class="btn" id="bagbtn" type="button">Tas</button>
        <button class="btn sec" id="profbtn" type="button">Profil</button>
        <button class="btn menubtn" id="menubtn" type="button">Menu</button>
        <button class="btn" id="mapbtn" type="button">Peta</button>
        <button class="btn hot" id="regen" type="button">Generasi ulang</button>
      </div>
    </div>
    <div class="bezel">
      <div id="fit">
        <div id="screen">
          <canvas id="cv" width="180" height="132" role="img" aria-label="Peta permainan Genesis Town"></canvas>
          <div id="fx" aria-hidden="true"></div>
          <div id="dlg" role="dialog" aria-live="polite"><div id="dwho"></div><span id="dtxt"></span><div id="dnext"></div></div>
          <div id="map" role="dialog" aria-label="Peta">
            <h2>Peta kota</h2>
            <canvas id="mm" width="120" height="120"></canvas>
            <div class="legend">
              <span><i style="background:#d98c5f"></i>Rumah</span><span><i style="background:#f2c94c"></i>Rumahmu</span><span><i style="background:#7fd18a"></i>Teman</span><span><i style="background:#e8503c"></i>Gedung umum</span><span><i style="background:#c6bba4"></i>Pasar</span><span><i style="background:#2a8cc0"></i>Sungai</span><span><i style="background:#3a3a52"></i>Belum dibuka</span>
            </div>
            <div class="hint">Ketuk peta (atau tekan M) untuk menutup</div>
          </div>
          <!-- phone controls: inside the game picture, so they line up with the item bar (css/phone.css) -->
          <div class="joy" id="joy" aria-hidden="true"><i></i></div>
          <button class="actbtn" id="btnAct" type="button" hidden aria-label="Aksi"><span class="ico" aria-hidden="true"></span><span class="lbl" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
    <div class="pad" id="pad">
      <div class="dpad">
        <button class="dp up" data-dir="up" type="button" aria-label="Atas"></button>
        <button class="dp left" data-dir="left" type="button" aria-label="Kiri"></button>
        <div class="mid"></div>
        <button class="dp right" data-dir="right" type="button" aria-label="Kanan"></button>
        <button class="dp dn" data-dir="down" type="button" aria-label="Bawah"></button>
      </div>
      <div class="ab">
        <button class="btn" id="padmap" type="button">Peta</button>
        <div class="abrow">
          <button id="btnE" type="button" aria-label="Tombol E, kirim pesan">E</button>
          <button id="btnA" type="button" aria-label="Tombol A">A</button>
        </div>
      </div>
    </div>
    <p class="help"><kbd>Panah/WASD</kbd> <span>jalan</span> &middot; <kbd>Spasi/Enter/Z</kbd> <span>bicara</span> &middot; <kbd>E</kbd> <span>pesan</span> &middot; <kbd>I</kbd> <span>tas</span> &middot; <kbd>P</kbd> <span>profil</span> &middot; <kbd>M</kbd> <span>peta</span></p>
  </div>
</main>
