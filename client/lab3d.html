<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/theme.css">
<!--
  Lab 3D: a test bench for the 3D world kit (js/three/*). It draws the real village (GTVillage, the server's seed) or a
  Homeland in three.js, with the player walking, the seasons, the hour of day and the see-through pass. It touches no
  game state, no login and no server API: it is not part of the game yet.
-->
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); color: var(--hud-ink); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 16px; right: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .tray { pointer-events: auto; display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--hud); border: var(--line) solid var(--outline);
    border-radius: var(--r-win); box-shadow: inset 0 calc(-1 * var(--edge)) 0 var(--season); }
  .title { font-family: var(--font-display); font-size: 16px; padding: 0 8px; color: var(--accent); }
  button { font: 600 15px var(--font); height: 36px; min-width: 36px; padding: 0 12px; color: var(--hud-ink); background: var(--hud-2); cursor: pointer;
    border: var(--line) solid var(--outline); border-radius: var(--r-ctl); box-shadow: inset 0 calc(-1 * var(--edge)) 0 var(--shade), inset 0 1px 0 var(--hud-hi);
    transition: transform var(--t-press) var(--ease); }
  button:hover { background: var(--hud-3); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  label { display: flex; gap: 8px; align-items: center; font-size: 15px; padding: 0 6px; }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  output { font-variant-numeric: tabular-nums; min-width: 44px; }
  .hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 12px; background: var(--chip, rgba(20,21,42,.85)); border-radius: var(--r-ctl);
    font-size: 14px; color: var(--hud-dim); white-space: nowrap; }
  kbd { font: 600 13px var(--font); color: var(--hud-ink); background: var(--hud-3); border: var(--line) solid var(--outline); border-radius: var(--r-ctl); padding: 0 5px; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 18px; }
  @media (max-width: 720px) { .hint { display: none; } input[type=range] { width: 100px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <div class="tray"><span class="title">Lab 3D</span>
    <button data-map="desa" aria-pressed="true">Desa</button><button data-map="homeland" aria-pressed="false">Homeland</button></div>
  <div class="tray" role="group" aria-label="Musim">
    <button data-season="semi" aria-pressed="true">Semi</button><button data-season="panas" aria-pressed="false">Panas</button>
    <button data-season="gugur" aria-pressed="false">Gugur</button><button data-season="dingin" aria-pressed="false">Dingin</button></div>
  <div class="tray"><label>Jam <input id="hour" type="range" min="0" max="24" step="0.25" value="10"> <output id="hourOut">10:00</output></label>
    <button id="zin" aria-label="Perbesar">+</button><button id="zout" aria-label="Perkecil">-</button></div>
</div>
<div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> jalan · <kbd>Q</kbd><kbd>E</kbd> putar kamera · scroll zoom</div>

<script src="vendor/three.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/buildings.js"></script>
<script src="js/world/village.js"></script>
<script src="js/world/homeland.js"></script>
<script src="js/three/kit.js"></script>
<script src="js/three/ground.js"></script>
<script src="js/three/building.js"></script>
<script src="js/three/nature.js"></script>
<script src="js/three/props.js"></script>
<script src="js/three/actor.js"></script>
<script src="js/three/sky.js"></script>
<script src="js/three/rig.js"></script>
<script src="js/three/seethrough.js"></script>
<script src="js/three/world.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  function fail(msg) { stage.innerHTML = '<div class="err">' + msg + '</div>'; }
  if (!window.THREE || !window.GT3) return fail('three.js belum dibangun. Jalankan <kbd>npm run build:client</kbd>.');
  var THREE = window.THREE, renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { return fail('Perangkat ini tidak mendukung WebGL.'); }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  stage.appendChild(renderer.domElement);
  var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(28, 1, 1, 160);
  var sky = GT3.Sky(scene, renderer), rig = GT3.Rig(camera);
  var state = { map: 'desa', season: 'semi', hour: 10 }, world = null, see = null, player = null, npcs = [], px = 0, pz = 0, dir = 'down', walkT = 0;
  var WORLD_SEED = 20261114; // the server's default WORLD_SEED (server/src/config.ts)

  function layout(kind) {
    if (kind === 'homeland') return GTHomeland.generate(1234567, { th: 3, open: ['c', 'n', 'e', 'w'], built: [{ lot: 'kolam-c', kind: 'kolam' }, { lot: 'restoran-c', kind: 'restoran' }, { lot: 'rumahsakit-c', kind: 'rumahsakit' }] });
    return GTVillage.generate(WORLD_SEED);
  }
  function load(kind) {
    if (world) { world.dispose(); npcs.forEach(function (n) { n.dispose(); }); if (player) player.dispose(); }
    var L = layout(kind); L.seed = L.seed || WORLD_SEED;
    if (window.SPRITES.setSeason) SPRITES.setSeason(state.season, state.season === 'dingin');
    world = GT3.World(L); scene.add(world.group);
    see = GT3.SeeThrough(world);
    px = L.spawn.x + 0.5; pz = L.spawn.y + 0.5;
    player = GT3.Actor(0); scene.add(player.group);
    npcs = ((L.market && L.market.stalls) || []).map(function (st, i) { var a = GT3.Actor(i + 1); a.set(st.seat.x + 0.5, st.seat.y + 0.55, 'down', 0); scene.add(a.group); return a; });
    rig.follow(px, pz, 1); rig.snap();
  }
  function hourText(h) { var hh = Math.floor(h) % 24, mm = Math.round((h - Math.floor(h)) * 60); return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm; }
  function press(sel, attr, val) { document.querySelectorAll(sel).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)); }); }
  function setSeason(s) {
    state.season = s; press('[data-season]', 'data-season', s);
    document.documentElement.className = document.documentElement.className.replace(/\bgt-s-\w+/g, '').trim() + ' gt-s-' + s;
    if (world) world.setSeason(s, s === 'dingin');
  }
  function setHour(h) { state.hour = +h; document.getElementById('hour').value = h; document.getElementById('hourOut').textContent = hourText(+h); }

  document.querySelectorAll('[data-map]').forEach(function (b) { b.onclick = function () { state.map = b.dataset.map; press('[data-map]', 'data-map', state.map); load(state.map); }; });
  document.querySelectorAll('[data-season]').forEach(function (b) { b.onclick = function () { setSeason(b.dataset.season); }; });
  document.getElementById('hour').oninput = function (e) { setHour(e.target.value); };
  document.getElementById('zin').onclick = function () { rig.zoom(rig.getZoom() * 1.2); };
  document.getElementById('zout').onclick = function () { rig.zoom(rig.getZoom() / 1.2); };
  renderer.domElement.addEventListener('wheel', function (e) { e.preventDefault(); rig.zoom(rig.getZoom() * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });

  var keys = {}, yaw = 0;
  addEventListener('keydown', function (e) {
    if (e.target && /INPUT|BUTTON/.test(e.target.tagName) && e.key === ' ') return;
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'q' || e.key === 'Q') { yaw -= Math.PI / 4; rig.turn(yaw); }
    if (e.key === 'e' || e.key === 'E') { yaw += Math.PI / 4; rig.turn(yaw); }
  });
  addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function resize() { var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); rig.zoom(rig.getZoom()); }
  addEventListener('resize', resize);

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    // walk: screen-relative to the camera's turn, blocked by solid tiles
    var ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), iz = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    if (ix || iz) {
      var c = Math.cos(yaw), s = Math.sin(yaw), mx = ix * c + iz * s, mz = -ix * s + iz * c, len = Math.hypot(mx, mz), sp = 4 * dt / len;
      var nx = px + mx * sp, nz = pz + mz * sp;
      if (world.walkable(Math.floor(nx), Math.floor(pz))) px = nx;
      if (world.walkable(Math.floor(px), Math.floor(nz))) pz = nz;
      dir = Math.abs(mx) > Math.abs(mz) ? (mx > 0 ? 'right' : 'left') : (mz > 0 ? 'down' : 'up');
      walkT += dt;
    } else walkT = 0;
    var step = walkT ? [1, 0, 2, 0][Math.floor(walkT * 8) % 4] : 0;
    player.set(px, pz, dir, step);
    rig.follow(px, pz, dt);
    sky.set(state.hour, state.season); sky.follow(px, pz);
    world.update(now / 1000, state.hour, sky.night);
    see.update(px, pz, dt);
    player.face(camera); npcs.forEach(function (n) { n.face(camera); });
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  setSeason('semi'); setHour(10); load('desa'); resize(); requestAnimationFrame(frame);
  // test handle for screenshots (no game state behind it)
  window.__lab = { setHour: setHour, setSeason: setSeason, load: function (k) { state.map = k; press('[data-map]', 'data-map', k); load(k); },
    teleport: function (x, z) { px = x; pz = z; rig.follow(px, pz, 1); rig.snap(); }, zoom: function (k) { return rig.zoom(k); },
    turn: function (r) { yaw = r; rig.turn(r); }, get pos() { return { x: px, z: pz }; }, renderer: renderer, scene: scene, world: function () { return world; } };
})();
</script>
</body>
</html>
