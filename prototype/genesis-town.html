function hpColor(f){ return f > 0.5 ? '#58d468' : f > 0.25 ? '#f2c94c' : '#e8504a'; }
function drawBar(g, x, y, f){
  // 14 x 4 dengan bingkai hitam
  g.fillStyle = '#14101c'; g.fillRect(x - 1, y - 1, 14, 4);
  g.fillStyle = '#4a3a52'; g.fillRect(x, y, 12, 2);
  var w = Math.max(f > 0 ? 1 : 0, Math.round(12 * f));

}
function drawKoMarks(g, x, y, side){
  var cx = x + 6, cy = y - 3;
  if (REDUCE){
    drawStar(g, cx - 5, cy + 1, false); drawStar(g, cx, cy - 1, false); drawStar(g, cx + 5, cy + 1, false);
  } else {
    for (var i = 0; i < 3; i++){
      var a = now * 4 + i * Math.PI * 2 / 3;
      drawStar(g, cx + Math.cos(a) * 6, cy + Math.sin(a) * 2, false);
    }

  var ph = REDUCE ? 0 : Math.floor(now * 1.6) % 2;

function drawThreat(g, x, y, t){
  var cx = x + 6, bob = REDUCE ? 0 : (Math.floor(now * 8) % 2);

  g.fillStyle = '#ffffff';
  g.fillRect(cx, cy + 1, 1, 3); g.fillRect(cx, cy + 5, 1, 1);
  g.fillStyle = '#e8302a';
  g.fillRect(cx - 6, cy - 2, 1, 2); g.fillRect(cx - 5, cy - 3, 2, 1);

function onDraw(g, camX, camY, TT){
  var sc = GT.scene; if (!sc) return;
  g.save();
  g.globalCompositeOperation = 'source-over';
  // karakter: bar HP, tanda KO, tanda marah
  var list = sc.npcs;
  for (var i = 0; i < list.length; i++){
    var n = list[i]; if (n.hidden || n._sx == null) continue;
    var v = n._v; if (!v) continue;
    var ko = n._ko > 0 || v.ko;
    if (v.bar > 0 || ko){
      var f = Math.max(0, Math.min(1, hp(n) / maxHp(n)));
      var a = ko ? 1 : Math.min(1, v.bar / 0.5);
      g.globalAlpha = a;
      drawBar(g, n._sx, n._sy - 5 - (ko ? 3 : 0), f);
      g.globalAlpha = 1;
    }
    if (ko) drawKoMarks(g, n._sx, n._sy - 3, v.koSide);
    if (v.threat > 0) drawThreat(g, n._sx, n._sy - (n.label ? 3 : 0), v.threat);
  }
  if (pv.threat > 0) drawThreat(g, pPos.x, pPos.y, pv.threat);
  if (pv.ko) drawKoMarks(g, pPos.x, pPos.y - 3, 1);
  // partikel
  for (var j = 0; j < parts.length; j++){
    var p = parts[j]; if (p.sc !== sc) continue;
    var x = Math.round(p.wx - camX), y = Math.round(p.wy - camY), f2 = p.t / p.life;
    if (p.k === 'p'){
      g.globalAlpha = f2 > 0.7 ? 1 - (f2 - 0.7) / 0.3 : 1;
      g.fillStyle = p.col; g.fillRect(x, y, p.sz, p.sz);
    } else if (p.k === 'star'){
      g.globalAlpha = 1;
      if (p.big) drawStar(g, x, y, f2 < 0.75, f2 > 0.5);
      else drawStar(g, x, y, f2 < 0.5, f2 > 0.5);
    } else if (p.k === 'text'){
      g.globalAlpha = f2 > 0.7 ? 1 - (f2 - 0.7) / 0.3 : 1;
      drawText(g, p.text, x, y, p.col);
    } else if (p.k === 'plus'){
      g.globalAlpha = f2 > 0.6 ? 1 - (f2 - 0.6) / 0.4 : 1;
      g.fillStyle = '#14101c'; g.fillRect(x - 2, y - 1, 5, 3); g.fillRect(x - 1, y - 2, 3, 5);
      g.fillStyle = p.col; g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3);
    } else if (p.k === 'swish'){
      g.globalAlpha = 1 - f2;
      g.fillStyle = '#ffffff';

      if (horiz){ g.fillRect(x - 1, y - 3, 1, 2); g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y + 2, 1, 2); }
      else { g.fillRect(x - 3, y - 1, 2, 1); g.fillRect(x - 1, y, 3, 1); g.fillRect(x + 2, y - 1, 2, 1); }
    }
  }
  g.restore();
}

<script>
/* curfew.js - Jam malam: 21:00-05:59 tidak ada warga di luar rumah.
 * Public: GT.curfew = { active(), homeOf(npc) -> building|null, isHome(npc), sendHome(npc, reason?) -> bool, exempt(npc) -> bool,
 *                       hiddenList(), _tick(dt) }
 *
 * - Warga luar ruangan (8 pengembara, bot sosial, NPC berjiwa) punya rumah deterministik (hash seed + key): rumah biasa, bukan milik pemain.
 *   Penghuni rumah ('house:<id>:n') tinggal di rumahnya (sudah di dalam ruangan, tidak disentuh).
 * - Mulai 21:00 mereka berjalan ke depan pintu rumahnya lalu menghilang (npcHide). Mulai 06:00 mereka muncul lagi di depan pintu
 *   (tile bebas terdekat) dan berkeliaran lagi, bergiliran beberapa detik. Jalan buntu/terhalang > 20 detik: langsung disembunyikan.
 * - Dikecualikan: polisi, pekerja (penjaga Mart / bandar / npc._post), NPC yang sedang mengikuti pemain, NPC yang sedang menjalankan
 *   rencana agen (GT.agent.status(npc).busy; setelah selesai mereka pulang), pemain online (isRemote), NPC yang sedang berkelahi / pingsan.
 * - Muat ulang / dunia baru saat jam malam: NPC yang terlihat dalam 5 detik pertama langsung disembunyikan (tanpa berjalan).
 * - Lompat waktu lewat panel Dev: keadaan dihitung dari jam setiap 0.25 detik, jadi dua arah berlaku segera.
 * - sendHome(npc, 'rest') dipakai combat.js: NPC pingsan pulang, istirahat sampai HP >= 70% (dan bukan jam malam), lalu keluar lagi.
 */
(function(){
'use strict';
if (!window.GT) return;
var GT = window.GT;

var clk = 0, born = 0, bornNight = false, acc = 0;
var homes = new Map();      // npc key -> building
var T_WALK = 20;            // detik sebelum teleport-sembunyi

function out(){ return GT.outScene; }
function hourNow(){
  var t = GT.time || {};
  var h = t.h != null ? t.h : t.hour;
  return isFinite(h) ? h : 12;
}
function active(){ var h = hourNow(); return h >= 21 || h < 6; }

function hash(s){
  s = String(s); var h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function isWorkerKey(k){ return /:keeper$/.test(k || '') || k === 'casino:dealer'; }

function homeOf(npc){
  if (!npc) return null;
  var key = GT.npcKey(npc), b = homes.get(key);
  if (b) return b;
  var bl = GT.buildings || [], m = /^house:(\d+):/.exec(key || '');
  if (m){
    for (var i = 0; i < bl.length; i++) if (bl[i].kind === 'house' && String(bl[i].id) === m[1]){ b = bl[i]; break; }
  } else {
    var hs = bl.filter(function(x){ return x.kind === 'house' && !x.own; });
    if (!hs.length) hs = bl.filter(function(x){ return x.kind === 'house'; });
    if (hs.length) b = hs[hash(GT.seed + '|home|' + key) % hs.length];
  }
  if (b) homes.set(key, b);
  return b || null;
}
function doorOf(b){ return b ? { x:b.dx, y:b.dy + 1 } : null; }

function agentBusy(n){
  try { return !!(GT.agent && GT.agent.status && GT.agent.status(n).busy); } catch(e){ return false; }
}
function exempt(n){
  if (!n) return true;
  if (n.isPolice || n.isRemote) return true;
  var k = n.key || '';
  if (isWorkerKey(k) || /^peer:/.test(k)) return true;
  if (n._post) return true;
  if (n.follow) return true;
  if (n._cb || n._ko > 0) return true;       // combat.js: berkelahi / kabur / pingsan
  if (agentBusy(n)) return true;
  return false;
}

function isHome(n){
  if (!n) return false;
  if (n._cf && n._cf.mode === 'home' && n.hidden) return true;
  var sc = GT.npcScene(n), b = homeOf(n);
  return !!(sc && sc.house && b && sc.house === b);
}

/* ---------- map helpers ---------- */
function visibleAt(sc, x, y, except){
  for (var i = 0; i < sc.npcs.length; i++){
    var o = sc.npcs[i]; if (o === except || o.hidden) continue;

  return false;
}
function playerAt(sc, x, y){
  if (GT.scene !== sc) return false;
  var p = GT.player;
  if (p.x === x && p.y === y) return true;
  try { var g = window.__game && window.__game.player; if (g && p.moving && g.fx === x && g.fy === y) return true; } catch(e){}

}
function freeSpot(door, except){

  var W = m.w, H = m.h, seen = new Uint8Array(W * H), q = [door.x, door.y], head = 0, fallback = null, n = 0;
  if (door.x < 0 || door.y < 0 || door.x >= W || door.y >= H) return null;
  seen[door.y * W + door.x] = 1;
  while (head < q.length && n < 140){
    var cx = q[head++], cy = q[head++], i = cy * W + cx; n++;
    var ok = m.walk[i] === 1 && !(m.exit && m.exit.has(i)) && !(m.staff && m.staff.has(i)) && !visibleAt(sc, cx, cy, except) && !playerAt(sc, cx, cy);
    if (ok){
      if (!(m.doorFront && m.doorFront.has(i))) return { x:cx, y:cy };
      if (!fallback) fallback = { x:cx, y:cy };

/* ---------- state machine ---------- */
function startGoing(n, reason, instant){
  var b = homeOf(n); if (!b) return false;

}
function enter(n){

  GT.npcHide(n, true);

}

    if (GT.combat && typeof GT.combat.hp === 'function') return GT.combat.hp(n) >= 0.7 * GT.combat.maxHp(n);

function tickNpc(sc, n, act, dt){
  var cf = n._cf;
  if (cf && cf.mode === 'home'){
    if (!n.hidden){ n._cf = null; return; }                       // dimunculkan pihak lain
    var okWake = !act && (cf.reason !== 'rest' || restOk(n)) && (cf.reason !== 'send' || clk - cf.since > 10);

    if (n.hidden){ n._cf = null; return; }
    var night = cf.reason === 'night';

    if (night && exempt(n)){ n._cf = null; return; }               // mulai mengikuti / berencana
    if (n.talking){ cf.t0 += dt; return; }                         // sedang diajak bicara
    var door = doorOf(cf.b);
    var d = Math.abs(n.x - door.x) + Math.abs(n.y - door.y);
    if (!n.moving && d <= 1){ enter(n); return; }
    if (clk - cf.t0 > T_WALK){ enter(n); return; }
    if (!n.script && !n.moving && clk >= cf.retry){
      cf.retry = clk + 0.6;
      var path = GT.findPath(sc, n, door, { avoid:function(x, y){ return (x !== door.x || y !== door.y) && visibleAt(sc, x, y, n); } }) || GT.findPath(sc, n, door);
      if (!path){ if (++cf.fail >= 4) enter(n); return; }
      if (!path.length){ enter(n); return; }
      GT.npcGo(n, path, null);
    }
    return;
  }
  // belum punya status
  if (n.hidden || !act || exempt(n)) return;
  startGoing(n, 'night', bornNight && clk - born < 5);
}

function tick(dt){
  var sc = out(); if (!sc || !sc.npcs) return;
  var act = active();
  sc.npcs.slice().forEach(function(n){
    try { tickNpc(sc, n, act, dt); } catch(e){ console.error('[curfew]', e); }
  });
}

function sendHome(n, reason){
  if (!n) return false;
  var sc = GT.npcScene(n);
  if (n._cf && n._cf.mode === 'home') return true;
  if (sc !== out()) return isHome(n);
  if (n.hidden) return false;
  if (n._cf && n._cf.mode === 'going'){ n._cf.reason = reason || n._cf.reason; return true; }
  return startGoing(n, reason || 'send', false);
}
function hiddenList(){
  var sc = out(); if (!sc) return [];
  return sc.npcs.filter(function(n){ return n._cf && n._cf.mode === 'home'; });
}

GT.curfew = { active:active, homeOf:homeOf, isHome:isHome, sendHome:sendHome, exempt:exempt, hiddenList:hiddenList,
  _tick:function(dt){ clk += dt || 0; tick(dt || 0); } };

GT.register({
  id:'curfew',
  onWorld:function(){ homes.clear(); born = clk; bornNight = active(); },
  onFrame:function(dt){
    clk += dt; acc += dt;
    if (acc < 0.25) return;
    var d = acc; acc = 0;
    tick(d);
  }
});
})();

<script>
/* gossip.js - Gosip warga (Genesis Town v2.4).
 * GT.gossip = {list(), knows(npc, id), create(o), learn(npc, id), spread(force), forNpc(npc), aboutPlayer(), wary(),
 *   onTheft(house, witness), summary(), _meet(a, b), _tick(dt), _clear(), _forceMention(true|false|null)}
 *
 * Item: {id, kind:'pukul'|'curi'|'maling_anon', about:'player'|npcKey, aboutName, victim:npcKey, victimName, place, day, heat, t0}
 * - Pemain memukul NPC -> korban tahu 'pukul' (sekali per korban per jam game). NPC memukul NPC -> gosip tentang penyerang.
 * - Pencurian peti: dilihat (penghuni di dalam) -> 'curi' bernama; tidak dilihat -> 'maling_anon' saat penghuni pulang (jam malam);
 *   warga waspada (peluang saksi +10% selama 1 hari game).
 * - Menyebar siang hari di luar (tiap ~2 dtk, NPC dalam 2 tile, peluang 35%, maks 3 lompatan per jam game).
 * - Tahu gosip tentang pemain: afinitas -5 (sekali per gosip), disebut saat diajak bicara (50%), petugas polisi yang tahu
 *   gosip bernama -> pemain jadi buronan (GT.police.setWanted). Gosip pudar setelah 2 hari game. Disimpan per seed.
 */
(function(){
'use strict';
if (!window.GT) return;
var GT = window.GT;
var LS = 'gt.gossip.v1';
var LIFE = 2 * 1440, SPREAD_EVERY = 2, CHANCE = 0.35, MAX_HOPS = 3, WARY_MIN = 1440;

var items = [];            // gossip items
var knows = {};            // id -> {npcKey:1}
var fxDone = {};           // id -> {npcKey:1} (afinitas sudah turun)
var pending = [];          // pencurian tak terlihat menunggu penghuni pulang: {houseId, owner, place, t0}
var seq = 1, clk = 0, acc = 0, hopHour = -1, hops = 0, waryUntil = -1;
var lastHit = {};          // 'a>b' -> menit game
var lastOnPlayer = {};     // npcKey -> clk saat NPC itu terakhir memukul pemain (pemain membela diri = tidak jadi gosip)
var saved = null, forceMention = null, saveT = 0;

function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function out(){ return GT.outScene; }
function total(){ return (GT.time && GT.time.total) || 0; }
function dayNow(){ return (GT.time && GT.time.day) || 1; }
function keyOf(n){ return typeof n === 'string' ? n : GT.npcKey(n); }
function npcOf(k){ if (k && typeof k === 'object') return k; try { return GT.findNpc(k); } catch(e){ return null; } }
function isWorker(n){ var k = (n && n.key) || ''; return /:keeper$/.test(k) || k === 'casino:dealer' || !!(n && n._post); }
function curfewOn(){
  try { if (GT.curfew && GT.curfew.active) return !!GT.curfew.active(); } catch(e){}
  var h = GT.time && GT.time.h; return h >= 21 || h < 6;
}
function itemById(id){ for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }

/* ---------- persistence (per seed) ---------- */
function persistNow(){
  saveT = 0;
  try {
    saved = { v:1, seed:GT.seed, items:items, knows:knows, fx:fxDone, pending:pending, seq:seq, wary:waryUntil };
    window.localStorage.setItem(LS, JSON.stringify(saved));
  } catch(e){}
}
function persist(){ if (!saveT) saveT = setTimeout(persistNow, 400); }
function load(){
  try { saved = JSON.parse(window.localStorage.getItem(LS) || 'null'); } catch(e){ saved = null; }
}
function restoreOrClear(){
  items = []; knows = {}; fxDone = {}; pending = []; seq = 1; waryUntil = -1; lastHit = {}; lastOnPlayer = {};
  if (saved && saved.seed === GT.seed && Array.isArray(saved.items)){
    items = saved.items.filter(function(it){ return it && it.id && it.kind; });
    knows = saved.knows || {}; fxDone = saved.fx || {}; pending = Array.isArray(saved.pending) ? saved.pending : [];
    seq = Math.max(+saved.seq || 1, items.reduce(function(m, it){ return Math.max(m, +it.id || 0); }, 0) + 1);
    waryUntil = isFinite(+saved.wary) ? +saved.wary : -1;
  }
}

/* ---------- text ---------- */
function snippet(it){
  if (it.kind === 'maling_anon') return 'Ada maling di ' + it.place + '!';
  if (it.kind === 'curi') return 'Katanya ada yang mencuri di ' + it.place + '!';
  if (it.about === 'player') return 'Katanya dia mukul ' + it.victimName + '!';
  return 'Katanya ' + (it.aboutName || 'seseorang') + ' mukul ' + it.victimName + '!';
}
function describe(it){
  var pn = (GT.state && GT.state.playerName) || 'Pemain';
  if (it.kind === 'maling_anon') return 'Ada maling di ' + it.place + ' (hari ' + it.day + ')';
  if (it.kind === 'curi') return (it.about === 'player' ? pn : (it.aboutName || 'Seseorang')) + ' mencuri di ' + it.place + ' (hari ' + it.day + ')';
  return (it.about === 'player' ? pn : (it.aboutName || 'Seseorang')) + ' memukul ' + it.victimName + ' (hari ' + it.day + ')';
}

/* ---------- core ---------- */
function create(o){
  o = o || {};
  var kind = o.kind;
  if (kind !== 'pukul' && kind !== 'curi' && kind !== 'maling_anon') return null;
  var vk = o.victim ? keyOf(o.victim) : '';
  var vn = o.victimName || (npcOf(o.victim) ? npcOf(o.victim).name : '') || '';
  var an = o.aboutName || '';
  if (o.about && o.about !== 'player' && !an){ var an0 = npcOf(o.about); an = an0 ? an0.name : ''; }
  var it = { id:seq++, kind:kind, about:(o.about && o.about !== 'player') ? keyOf(o.about) : 'player', aboutName:an, victim:vk, victimName:vn,
    place:o.place || 'kota', day:dayNow(), heat:o.heat != null ? o.heat : (kind === 'maling_anon' ? 1 : 2), t0:total() };
  items.push(it); knows[it.id] = {}; fxDone[it.id] = {};
  if (kind === 'maling_anon') waryUntil = total() + WARY_MIN;
  (o.knowers || []).forEach(function(n){ if (n) learn(n, it.id, null, true); });
  persist();
  try { GT.emit('gossip', { gossip:it }); } catch(e){}
  return it;
}
/* npc mengetahui gosip. quiet = tanpa efek 'korban' tambahan */
function learn(npc, id, from){
  var it = typeof id === 'object' ? id : itemById(id); npc = npcOf(npc);
  if (!it || !npc) return false;
  var k = keyOf(npc), kn = knows[it.id] || (knows[it.id] = {});
  if (kn[k]) return false;
  kn[k] = 1;
  var fx = fxDone[it.id] || (fxDone[it.id] = {});
  if (it.about === 'player' && (it.kind === 'pukul' || it.kind === 'curi')){
    var isVictimHit = it.kind === 'pukul' && it.victim === k;      // korban sudah kehilangan 10 afinitas karena pukulan
    if (!fx[k] && !isVictimHit && !npc.isPolice && !npc.noAffinity){ fx[k] = 1; try { GT.addAffinity(npc, -5); } catch(e){} }
    if (npc.isPolice && GT.police && typeof GT.police.setWanted === 'function'){
      GT.police.setWanted(it.kind === 'curi' ? 'theft' : 'assault', it.kind === 'curi' ? (it.victimName || '') : it.victimName);
    }
  } else if (it.about !== 'player' && it.kind === 'pukul' && it.about !== k && it.victim !== k){
    try { if (GT.agent && GT.agent.addRelation) GT.agent.addRelation(npc, it.about, -5); } catch(e){}
  }
  persist();
  return true;
}
function knowsFn(npc, id){ var kn = knows[id]; return !!(kn && kn[keyOf(npc)]); }

function active(it){ return total() - it.t0 <= LIFE; }
function prune(){
  var n0 = items.length;
  items = items.filter(function(it){
    if (active(it)) return true;
    delete knows[it.id]; delete fxDone[it.id]; return false;
  });
  pending = pending.filter(function(p){ return total() - p.t0 <= LIFE; });
  if (items.length !== n0) persist();
}

/* ---------- spreading ---------- */
function cheb(a, b){ return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function hearer(n){ return !n.hidden && !n.isRemote && !n.isBot && n.key !== 'casino:dealer'; }
function spread(force){
  var sc = out(); if (!sc || !sc.npcs) return 0;
  if (!force && curfewOn()) return 0;
  var hr = Math.floor(total() / 60);
  if (hr !== hopHour){ hopHour = hr; hops = 0; }
  var npcs = sc.npcs.filter(hearer), done = 0;
  items.forEach(function(it){
    if (!active(it)) return;
    var kn = knows[it.id] || {};
    var tellers = npcs.filter(function(n){ return kn[GT.npcKey(n)] && !n.isPolice && !n.talking; });
    tellers.forEach(function(t){
      npcs.forEach(function(n){
        if (n === t || kn[GT.npcKey(n)] || cheb(n, t) > 2) return;
        if (!force && hops >= MAX_HOPS) return;
        if (!force && Math.random() >= CHANCE) return;
        if (learn(n, it.id, t)){
          kn[GT.npcKey(n)] = 1; hops++; done++;
          GT.npcSay(t, snippet(it));
        }
      });
    });
  });
  return done;
}
/* paksa dua NPC bertemu: saling berbagi semua gosip */
function meet(a, b){
  a = npcOf(a); b = npcOf(b); if (!a || !b) return 0;
  var c = 0;
  items.forEach(function(it){
    var ka = knowsFn(a, it.id), kb = knowsFn(b, it.id);
    if (ka && !kb && learn(b, it.id, a)){ c++; if (!a.isPolice) GT.npcSay(a, snippet(it)); }
    else if (kb && !ka && learn(a, it.id, b)){ c++; if (!b.isPolice) GT.npcSay(b, snippet(it)); }
  });
  return c;
}

/* pencurian tak terlihat: penghuni menemukan saat pulang */
function resolvePending(){
  if (!pending.length) return;
  var sc = out(); if (!sc) return;
  pending.slice().forEach(function(p){
    var cand = null;
    sc.npcs.forEach(function(n){
      if (cand || !n._cf || n._cf.mode !== 'home') return;
      var b = null; try { b = GT.curfew && GT.curfew.homeOf(n); } catch(e){}
      if (b && String(b.id) === String(p.houseId)) cand = n;
    });
    if (!cand && curfewOn() && total() - p.t0 > 30){
      var hid = (GT.curfew && GT.curfew.hiddenList) ? GT.curfew.hiddenList() : [];
      var ok = true; // tidak ada penghuni terpetakan ke rumah ini? pakai tetangga pertama yang sudah pulang
      sc.npcs.forEach(function(n){ try { var b = GT.curfew.homeOf(n); if (b && String(b.id) === String(p.houseId)) ok = false; } catch(e){} });
      if (ok && hid.length) cand = hid[0];
    }
    if (!cand) return;
    pending.splice(pending.indexOf(p), 1);
    create({ kind:'maling_anon', about:'player', place:p.place, knowers:[cand] });
  });
}
function onTheft(house, witness){
  if (!house) return null;
  var place = 'rumah ' + (house.owner || '?');
  if (witness){
    return create({ kind:'curi', about:'player', victim:witness, victimName:house.owner || witness.name, place:place, knowers:[witness] });
  }
  pending.push({ houseId:house.id, owner:house.owner || '', place:place, t0:total() });
  persist();
  return null;
}

/* ---------- queries ---------- */
function list(){ return items.filter(active).map(function(it){ var o = JSON.parse(JSON.stringify(it)); o.knowers = Object.keys(knows[it.id] || {}); return o; }); }
function forNpc(npc){
  var k = keyOf(npc), r = [];
  items.forEach(function(it){ if (active(it) && knows[it.id] && knows[it.id][k]) r.push(describe(it)); });
  return r;
}
function aboutPlayer(){
  return items.filter(function(it){ return active(it) && it.about === 'player'; }).map(function(it){
    return { id:it.id, kind:it.kind, text:describe(it), count:Object.keys(knows[it.id] || {}).length };
  });
}
function summary(){ return aboutPlayer(); }
function wary(){ return total() < waryUntil; }

/* ---------- mention when talking ---------- */
function mentionPages(npc, it){
  var k = keyOf(npc);
  if (it.kind === 'maling_anon') return ['Hati-hati, katanya ada maling di ' + it.place + '.', 'Kunci pintumu baik-baik.'];
  if (it.kind === 'curi') return ['Aku dengar ada yang mencuri di ' + it.place + '...', 'Katanya itu kamu. Jangan begitu lagi, ya.'];
  if (it.victim === k) return ['Kamu memukulku tadi... Aku tidak akan lupa.'];
  return ['Aku dengar kamu memukul ' + it.victimName + '...', 'Jangan suka main tangan, ya.'];
}
function onInteract(ctx){
  if (!ctx || !ctx.npc || ctx.mode !== 'talk') return false;
  var npc = ctx.npc;
  if (npc.isPolice || npc.isPlayer || npc.isRemote || npc.isBot || isWorker(npc) || npc._cb || npc._ko > 0) return false;
  var k = GT.npcKey(npc), mine = items.filter(function(it){ return active(it) && (it.about === 'player') && knows[it.id] && knows[it.id][k]; });
  if (!mine.length) return false;
  var go = forceMention === null ? Math.random() < 0.5 : !!forceMention;
  if (!go) return false;
  var it = mine[mine.length - 1];
  GT.dialog(mentionPages(npc, it), npc.name, npc);
  return true;
}

/* ---------- Profil: kabar tentangmu + status buronan ---------- */
function decorateProfile(){
  var root = document.getElementById('mroot'); if (!root) return;
  var boxes = root.querySelectorAll('.mbox');
  for (var i = 0; i < boxes.length; i++){
    var b = boxes[i], t = b.querySelector('.mtitle');
    if (!t || t.textContent !== 'Profil' || b.getAttribute('data-gos')) continue;
    b.setAttribute('data-gos', '1');
    var body = b.querySelector('.mbody'); if (!body) continue;
    var w = GT.police && GT.police.wanted;
    var p1 = el('p', 'gos-status', 'Status: ' + (w ? 'DICARI karena ' + GT.police.reasonText(w) + ' (denda ' + w.fine + ' koin)' : 'bebas'));
    if (w) p1.style.color = 'var(--bad, #c0392b)';
    body.appendChild(p1);
    var ap = aboutPlayer();
    var p2 = el('p', 'gos-head', 'Kabar tentangmu: ' + (ap.length ? '' : 'belum ada'));
    body.appendChild(p2);
    ap.slice(-4).forEach(function(a){ body.appendChild(el('p', 'mnote gos-line', a.text + ' — ' + a.count + ' warga tahu')); });
  }
}
function watchProfile(){
  var root = document.getElementById('mroot'); if (!root || !window.MutationObserver) return;
  try { new MutationObserver(function(){ try { decorateProfile(); } catch(e){} }).observe(root, { childList:true, subtree:true }); } catch(e){}
}

/* ---------- events ---------- */
function placeLabel(){
  var sc = GT.scene;
  if (sc && sc.house) return 'rumah ' + (sc.house.owner || '?');
  if (sc && sc.kind === 'mart') return 'Mart';
  if (sc && sc.kind === 'casino') return 'Kasino';
  return 'jalan';
}
GT.on('hit', function(e){
  try {
    if (!e || e.noReact) return;
    if (e.target === 'player' && e.attackerNpc){ lastOnPlayer[e.attacker] = clk; return; }
    if (!e.targetNpc) return;
    var t = total();
    if (e.attacker === 'player'){
      if (e.targetNpc.isRemote) return;
      if (lastOnPlayer[e.target] != null && clk - lastOnPlayer[e.target] < 15) return;      // membela diri
      var pk = 'player>' + e.target;
      if (lastHit[pk] != null && t - lastHit[pk] < 60) return;
      lastHit[pk] = t;
      create({ kind:'pukul', about:'player', victim:e.targetNpc, victimName:e.targetNpc.name, place:placeLabel(), knowers:[e.targetNpc] });
    } else if (e.attackerNpc && !e.attackerNpc.isPolice){
      var nk = e.attacker + '>' + e.target;
      if (lastHit[nk] != null && t - lastHit[nk] < 60) return;
      lastHit[nk] = t;
      create({ kind:'pukul', about:e.attackerNpc, aboutName:e.attackerNpc.name, victim:e.targetNpc, victimName:e.targetNpc.name, place:placeLabel(), knowers:[e.targetNpc] });
    }
  } catch(err){ console.error('[gossip]', err); }
});

function tick(dt){
  clk += dt; acc += dt;
  if (acc < SPREAD_EVERY) return;
  acc = 0;
  prune(); resolvePending();

// jalan di dalam satu scene ke salah satu tile -> {ok, note}
async function walkTiles(npc, sc, tilesFn, ctx){
  var tries = 0;
  while (tries < 4){
    chk(ctx);
    if (npcSc(npc) !== sc) return fail('berpindah tempat');
    var tiles = tilesFn();
    if (!tiles || !tiles.length) return fail('tak_ada_jalan');
    var here = tiles.some(function(t){ return t.x === npc.x && t.y === npc.y; });
    if (here) return okr('sampai');
    var best = shortest(sc, { x:npc.x, y:npc.y }, tiles, npc);
    if (!best && isWorkerKey(key(npc))){        // petugas di kantong staf (terkurung): pindah langsung ke tile tujuan terdekat
      var tt = tiles[0];
      if (tt && GT.moveNpc(npc, sc, tt.x, tt.y)){ await sleep(DELAY.settle, ctx.signal); return okr('sampai'); }
    }
    if (!best) return fail('tak_ada_jalan');
    if (!best.path.length) return okr('sampai');
    if (npc.follow) GT.npcFollow(npc, false);
    var ok = await walkPath(npc, best.path, ctx);
    chk(ctx);
    if (ok) return okr('sampai');
    tries++;
    await sleep(200, ctx.signal);
  }
  return fail('jalan_terhalang');
}
async function leaveBuilding(npc, ctx){
  var sc = npcSc(npc);

  var m = sc.map, e = m.entry || m.mat;
  if (e && !(npc.x === e.x && npc.y === e.y)){
    var p = route(sc, { x:npc.x, y:npc.y }, e, npc);
    if (p && p.length){ await walkPath(npc, p, ctx); chk(ctx); }
  }
  if (npcSc(npc) !== sc) return okr('di luar');
  var f = GT.doorFront(sc.house);
  GT.moveNpc(npc, 'out', f.x, f.y);
  npc.wait = 0.6;
  await sleep(DELAY.settle, ctx.signal);
  return okr('keluar');
}
function isHomeOf(npc, b){ var h = homeDest(npc); return !!h && h.t === 'bld' && h.b === b; }

async function goBuilding(npc, b, ctx){
  if (!b) return fail('tempat tak ditemukan');

var ALIAS = { bunga:['kembang'], kue:['kek', 'cake'], permen:['permen'], susu:['susu'], roti:['roti'], apel:['apel'], obeng:['obeng'] };

  if (!s) return null;
  var ids = Object.keys(GT.ITEMS || {});
  if (ids.indexOf(s) >= 0) return s;
  var hit = null;
  ids.forEach(function(id){
    var names = [String((GT.ITEMS[id] && GT.ITEMS[id].name) || '').toLowerCase()].concat(ALIAS[id] || []);

}
function itemsIn(s){

    var names = [id, String((GT.ITEMS[id] && GT.ITEMS[id].name) || '').toLowerCase()].concat(ALIAS[id] || []);
    names.forEach(function(nm){

}
var NUMW = { satu:1, dua:2, tiga:3, empat:4, lima:5, enam:6, tujuh:7, delapan:8, sembilan:9, sepuluh:10, sebuah:1, seporsi:1 };

function playerHouse(){ var o = W().own; return o ? { t:'bld', b:o, label:'rumah ' + playerName() } : null; }

var PLAYER_WORDS = /\b(aku|saya|gue|gw|kemari|kesini|sini|pemain|player|dekatku|sampingku|tempatku|padaku|kepadaku|untukku|ku)\b/;

/* ------------------------------------------------------------------ pergi ke tujuan / karakter */
function charPos(c){
  if (!c) return null;
  if (c.kind === 'player') return { sc:GT.scene, x:GT.player.x, y:GT.player.y, player:true };
  var n = npcByKey(c.key); if (!n) return null;
  var sc = npcSc(n); if (!sc) return null;
  return { sc:sc, x:n.x, y:n.y, npc:n };
}
async function goChar(npc, c, ctx){
  if (c.kind === 'npc' && c.key === key(npc)) return okr('sudah di sana');
  for (var attempt = 0; attempt < 7; attempt++){
    chk(ctx);
    var tp = charPos(c);
    if (!tp) return fail('tidak menemukan ' + c.name);
    var sc = npcSc(npc);
    if (sc === tp.sc){
      var d = Math.abs(npc.x - tp.x) + Math.abs(npc.y - tp.y);
      if (d <= 2 && (d <= 1 || attempt >= 1 || true)) return okr('dekat ' + c.name);
      var wk = await walkTiles(npc, sc, function(){ var t2 = charPos(c); return t2 && t2.sc === sc ? neighborTiles(sc, t2, npc, 2) : []; }, ctx);
      if (!wk.ok && wk.note === 'tak_ada_jalan') return fail('tidak bisa menjangkau ' + c.name);
      continue;
    }
    if (tp.sc === outS()){
      var lv = await leaveBuilding(npc, ctx); if (!lv.ok) return lv;
      continue;
    }
    var gb = await goBuilding(npc, tp.sc.house, ctx);
    if (!gb.ok) return gb;
  }
  return fail('tidak berhasil mendekati ' + c.name);
}
async function goDest(npc, d, ctx){
  if (!d) return fail('tujuan tidak dikenal');
  if (npc.follow) GT.npcFollow(npc, false);
  if (d.t === 'bld') return goBuilding(npc, d.b, ctx);
  if (d.t === 'char') return goChar(npc, d.who, ctx);
  if (d.t === 'park') return goOutdoorTiles(npc, function(){ return parkTiles({ x:npc.x, y:npc.y }, npc); }, ctx);
  if (d.t === 'spot' || d.t === 'tile'){
    return goOutdoorTiles(npc, function(){
      var tx = Math.max(0, Math.min(W().w - 1, d.x)), ty = Math.max(0, Math.min(W().h - 1, d.y)), out = [];
      for (var r = 0; r <= 3 && !out.length; r++) for (var dy = -r; dy <= r; dy++) for (var dx = -r; dx <= r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        var x = tx + dx, y = ty + dy;
        if (walkableAt(outS(), x, y) && !occupiedAt(outS(), x, y, npc)) out.push({ x:x, y:y });
      }
      return out;
    }, ctx);
  }
  return fail('tujuan tidak dikenal');
}

/* ------------------------------------------------------------------ log, event */
var listeners = [];
function onEvent(fn){ listeners.push(fn); return function(){ var i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); }; }
function emit(type, o){ o = o || {}; o.type = type; listeners.slice().forEach(function(f){ try { f(o); } catch(e){} }); }

/* ------------------------------------------------------------------ menjalankan rencana */
var runs = {};           // npcKey -> run
var runSeq = 0;
function summarizePlan(steps){ return steps.map(stepLabel).join(', '); }
function runKind(steps){
  var has = function(n){ return steps.some(function(s){ return s['do'] === n; }); };
  if (has('beli')) return 'fetch';
  if (steps.length === 1 && steps[0]['do'] === 'kerja') return 'post';
  if (has('pergi') || has('pulang') || has('tidur')) return steps.length === 1 ? 'goto' : 'plan';
  return 'plan';
}
function mkCtx(r){
  var npc = r.npc;
  return {
    npc:npc, signal:r.ctl.signal, source:r.source, depth:r.depth || 0, forced:!!r.forced,
    say:function(t){ GT.npcSay(npc, t); emit('say', { npc:npc, key:r.key, text:String(t) }); },
    log:function(t){ emit('log', { npc:npc, key:r.key, text:String(t) }); },
    wallet:function(){ return wallet(npc); },
    bag:function(){ return bag(npc); },
    go:function(d){ return goDest(npc, typeof d === 'string' ? resolvePlace(d, npc) : d, mkCtxSelf(r)); },
    _run:r

}
function mkCtxSelf(r){ return r._ctx || (r._ctx = mkCtx(r)); }
function setThought(npc, on, text){
  try {
    if (on){ if (npc._thoughtSaved === undefined){ npc._thoughtSaved = npc.label || null; } npc.label = clampStr(text || '...', 22); }
    else if (npc._thoughtSaved !== undefined){ npc.label = npc._thoughtSaved; delete npc._thoughtSaved; }
  } catch(e){}
}
function run(npc, plan, opts){
  opts = opts || {};

  if (!npc || !np.steps.length) return Promise.resolve({ ok:false, done:[], note:'rencana kosong', dropped:np.notes });
  var k = key(npc), cur = runs[k];
  try { homeDest(npc); } catch(e){}
  if (cur){
    if (opts.source === 'auto' && cur.source !== 'auto') return Promise.resolve({ ok:false, done:[], busy:true, note:'sedang sibuk' });
    cancel(npc, 'baru');
  }
  var r = { id:++runSeq, key:k, npc:npc, ctl:new AbortController(), steps:np.steps, states:np.steps.map(function(){ return { state:'wait', note:'' }; }), i:0,
    source:opts.source || 'player', depth:opts.depth || 0, kind:runKind(np.steps), started:now(), epoch:opts.epoch, forced:!!opts.forced };
  runs[k] = r;
  if (r.source === 'auto') setThought(npc, true, '… ' + stepLabel(np.steps[0]));
  emit('plan', { npc:npc, key:k, steps:np.steps.map(stepLabel), source:r.source, dropped:np.notes });
  r.promise = exec(r, opts);
  return r.promise;
}
async function exec(r, opts){
  var npc = r.npc, res = { ok:true, done:[], dropped:[] };
  var ctx = mkCtxSelf(r);
  for (var i = 0; i < r.steps.length; i++){
    r.i = i;
    if (r.ctl.signal.aborted){ res.ok = false; res.cancelled = true; break; }
    var st = r.steps[i], a = actions[st['do']];
    r.states[i] = { state:'run', note:'' };
    if (r.source === 'auto') setThought(npc, true, '… ' + stepLabel(st));
    emit('step', { npc:npc, key:r.key, i:i, state:'run', label:stepLabel(st) });
    var out;
    try {
      var p = a.run(npc, st, ctx);
      if (a.timeout) p = Promise.race([p, new Promise(function(resv){ setTimeout(function(){ resv({ ok:false, note:'waktu habis' }); }, a.timeout); })]);
      out = await p;
    } catch(e){
      if (e && e.aborted) out = { ok:false, note:'dibatalkan', cancelled:true };

    }

    res.done.push({ step:st, ok:!!out.ok, note:note });
    emit('step', { npc:npc, key:r.key, i:i, state:out.ok ? 'ok' : 'fail', label:stepLabel(st), note:note });
    if (!out.ok){ res.ok = false; res.failed = { i:i, step:st, note:note }; break; }
  }

  if (r.source === 'auto') setThought(npc, false);
  if (res.cancelled) settleAfterCancel(npc);

}
function cancel(npc, why){
  if (!npc) return false;
  var k = key(npc), r = runs[k];
  stopFollow(k);
  if (npc.follow) { try { GT.npcFollow(npc, false); } catch(e){} }
  if (!r) return false;
  r.cancelWhy = why || 'batal';
  try { r.ctl.abort(); } catch(e){}
  try { if (npc.script) GT.npcGo(npc, []); } catch(e){}

}
function status(npc){
  if (!npc) return { busy:false };

  var o = { busy:!!r, step:r ? r.i : -1, plan:[], wallet:d.w, bag:bag(npc), memory:d.mem.slice(-10), source:r ? r.source : null, kind:r ? r.kind : null, auto:isAuto(k) };

}
function runOf(k){ return runs[k] || null; }

/* ------------------------------------------------------------------ ikuti (karakter lain) */
var followers = {};
function stopFollow(k){ var f = followers[k]; if (f){ clearInterval(f.iv); delete followers[k]; } }
function startFollowNpc(npc, c){
  var k = key(npc); stopFollow(k);
  var busy = false, f = followers[k] = { c:c, iv:0 };
  f.iv = setInterval(function(){
    if (busy || npc.script || runs[k]) return;
    var tp = charPos(c), sc = npcSc(npc);
    if (!tp || tp.sc !== sc){ stopFollow(k); return; }
    if (Math.abs(npc.x - tp.x) + Math.abs(npc.y - tp.y) <= 2) return;
    var best = shortest(sc, { x:npc.x, y:npc.y }, neighborTiles(sc, tp, npc, 2), npc);
    if (best && best.path.length){ busy = true; GT.npcGo(npc, best.path.slice(0, 12), function(){ busy = false; }); }
  }, 900);
}

function describeThing(a){

function askPlayer(npc, thing, signal){
  return new Promise(function(res){
    var done = false, h = null, tmo = 0;
    function fin(v){ if (done) return; done = true; clearTimeout(tmo); if (signal) signal.removeEventListener('abort', ab); res(v); try { if (h && h.isOpen()) h.close('x'); } catch(e){} }
    function ab(){ fin(false); }
    if (signal){ if (signal.aborted) return res(false); signal.addEventListener('abort', ab, { once:true }); }
    var open = function(){
      if (done) return;
      var p = document.createElement('p'); p.textContent = npc.name + ' meminta ' + thing + ' darimu. Beri?';
      h = GT.modal({ title:'Permintaan', body:p, closable:true, actions:[
        { id:'ya', label:'Beri', primary:true, onClick:function(){ fin(true); return true; } },
        { id:'tidak', label:'Tolak', onClick:function(){ fin(false); return true; } }
      ], onClose:function(){ fin(false); } });
    };
    var tries = 0;
    (function wait(){ if (done) return; if (GT.isUiOpen() && tries++ < 60) return setTimeout(wait, 500); open(); })();
    tmo = setTimeout(function(){ fin(false); }, 60000);
  });
}

// efek ancaman: bubble + FX + reaksi sasaran menurut watak. -> 'none' | 'flee' | 'give' | 'fight'
function threatEffects(npc, c){

  var ns = outS().npcs.filter(function(n){ return n.key && !n.hidden && !n.isPolice && !n.isRemote && !isWorkerKey(n.key) && !n.follow && !n.talking && !runs[n.key] && !isKO(n); });
  var worst = null;

    var pk = a.key + '>' + b.key; if (t - (lastThreat[pk] || -1e9) < 120) continue;

}

/* ------------------------------------------------------------------ parser teks Indonesia -> rencana */
var STOP = /\b(berhenti|stop|diam|tunggu (di )?sini|tunggu disini|stay|lepas|cukup sampai sini)\b|\bjangan\s+ikut\w*|\b(tidak|nggak|gak|ga|enggak)\s+usah\s+ikut\w*/;
var FOLLOW = /\b(ikut\w*|temani|temenin|menemani|jalan bareng|ayo jalan|follow)\b/;

var VERBS = 'beli\\w*|membeli|belanja|kasih\\w*|beri\\w*|berikan|ambilkan|ambilin|belikan|ikut\\w*|main|bermain|tunggu|pulang|tidur|bilang|katakan|bicara|ngobrol|lapor\\w*|ingat\\w*|minta\\w*|lakukan|jalankan|ajari|ancam\\w*|mengancam|gertak\\w*|menggertak|pukul\\w*|memukul|serang\\w*|menyerang|hajar\\w*|menghajar|tonjok\\w*|menonjok|hantam\\w*|baikan|berbaikan|damai|berdamai|maafkan';
var SPLIT_VERB = new RegExp('\\s+(?=(?:' + VERBS + ')\\b)', 'g');
var SKIP_BEFORE = /\b(jangan|tidak|nggak|gak|ga|mau|bisa|ayo|tolong|coba|mari|boleh|harus|usah|dan|lalu|terus|ke|dari|untuk|buat)$/;

function splitClauses(raw){
  var t = ' ' + String(raw || '').toLowerCase().replace(/[“”"]/g, '').replace(/[,;]+/g, ' | ').replace(/\s+/g, ' ') + ' ';
  t = t.replace(/\s+(lalu|terus|kemudian|setelah itu|habis itu|abis itu|selanjutnya|trus|baru|sesudah itu)\s+/g, ' | ');
  t = t.replace(/\s+dan\s+(?=(?:ke|pergi|menuju|beli\w*|membeli|kasih\w*|beri\w*|berikan|ikut\w*|main|bermain|pulang|tidur|tunggu|bilang|katakan|bicara|ambil\w*|lapor\w*|ingat\w*|minta\w*|ancam\w*|mengancam|gertak\w*|menggertak|pukul\w*|memukul|serang\w*|menyerang|hajar\w*|menghajar|tonjok\w*|menonjok|hantam\w*|baikan|berbaikan|damai|berdamai|maafkan)\b)/g, ' | ');
  var parts = t.split('|'), out = [];
  parts.forEach(function(p){
    p = p.trim(); if (!p) return;
    // pecah sebelum kata kerja bila tidak didahului kata pembantu
    var words = p.split(' '), cur = [];
    words.forEach(function(wd, i){
      if (i > 0 && new RegExp('^(?:' + VERBS + ')$').test(wd) && !SKIP_BEFORE.test(words[i - 1])){ out.push(cur.join(' ')); cur = []; }
      cur.push(wd);
    });
    out.push(cur.join(' '));
  });
  return out.map(function(x){ return x.trim(); }).filter(Boolean);
}
function placeToken(d, npc){
  if (!d) return null;
  if (d.t === 'char') return d.who.kind === 'player' ? 'aku' : d.who.name;
  if (d.t === 'bld'){

function parseText(text, c){
  c = c || {};

  var raw = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
  // ajari NAMA: langkah, langkah
  var mt = /^\s*(?:tolong\s+)?ajari(?:n)?\s+(?:kamu\s+)?(.+?)\s*[:\-]\s*(.+)$/i.exec(raw);
  if (mt){

    return { steps:[{ 'do':'ajari', nama:clampStr(mt[1].trim().toLowerCase(), 24), langkah:sub.steps }], skipped:sub.skipped, teach:true };
  }

    var s = norm(cl).replace(/\brumahmu\b|\brumah kamu\b/g, ' rumah ').replace(/\s+/g, ' ');
    s = ' ' + s.trim() + ' ';
    var its = itemsIn(s), added = 0;
    function push(st){ steps.push(st); added++; }
    if (STOP.test(s)){ push({ 'do':'berhenti' }); return; }
    var m = /\b(?:lakukan|jalankan|kerjakan|terapkan)\s+(?:skill\s+|keahlian\s+|keterampilan\s+)?([a-z0-9 ]+?)\s*$/.exec(s);
    if (m){ var nm = m[1].trim(); if (nm && (skillStore[nm] || true)){ push({ 'do':'lakukan', nama:nm }); return; } }
    m = /\bingat\w*\s+(?:bahwa\s+|kalau\s+)?(.+?)\s*$/.exec(s);
    if (m){ push({ 'do':'ingat', catatan:clampStr(m[1], 100) }); return; }
    var hv = /\b(damai|berdamai|baikan|berbaikan|maafkan|minta maaf)\b/.exec(s) || /\b(ancam\w*|mengancam|gertak\w*|menggertak)\b/.exec(s) || /\b(pukul\w*|memukul|serang\w*|menyerang|hajar\w*|menghajar|tonjok\w*|menonjok|hantam\w*|menghantam)\b/.exec(s);
    if (hv && !(/\bpukul\s+\d/.test(s))){
      var hw = hv[1], kind = /damai|baikan|maaf/.test(hw) ? 'damai' : /ancam|gertak/.test(hw) ? 'ancam' : 'pukul';
      var htg = resolveChar(s.replace(hv[0], ' '), npc);
      if (!htg){ skipped.push(cl); return; }
      var hst = { 'do':kind, target:htg.kind === 'player' ? 'aku' : htg.name };
      if (kind === 'pukul'){ var hk = /\b(\d{1,2})\s*(kali|x)\b/.exec(s) || new RegExp('\\b' + NUMRE + '\\s*kali\\b').exec(s); if (hk) hst.kali = toNum(hk[1]) || 3; }

    }

/* ------------------------------------------------------------------ parser JSON {reply, plan:[{do,...}], affinity_delta} (format lama {action} tetap diterima) */
function stripFences(s){

  return s;
}

    for (var j = i; j < s.length; j++){
      var c = s.charAt(j);
      if (inStr){ if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; }
      else if (c === '"') inStr = true;

}

function lowerKeys(o){ var r = {}; Object.keys(o).forEach(function(k){ r[k.toLowerCase()] = o[k]; }); return r; }

}
// rencana -> aksi lama (untuk kompatibilitas hasil ask())

}

    if (typeof a === 'string') type = a;

      else if (a['do'] != null || a['DO'] != null){ var np3 = GT.agent.normalizePlan([a]); plan = np3.steps; notes = np3.notes; }

    }
    if (!plan){

      if (type === 'refuse') refuse = true;

      target = target == null ? null : String(target).trim().toLowerCase();
      if (TARGETS.indexOf(target) < 0) target = null;
      item = item == null ? null : String(item).trim().toLowerCase();

/* ------------------------------------------------------------------ otak lokal (kata kunci Indonesia, multi-langkah via GT.agent.parseText) */
var RUDE = /\b(bodoh|tolol|goblok|bego|anjing|anjir|babi|bangsat|sialan|brengsek|jelek|idiot|tai|kampret|bacot|sinting|jancok|asu|kontol|memek|monyet|sampah|enyah|benci kamu|pergi sana|dasar lu|dasar kamu|cerewet|nyebelin)\b/;
var POLITE = /\b(tolong|please|makasih|terima kasih|terimakasih|thanks|thx|sayang|hebat|keren|manis|cantik|ganteng|maaf|baik banget|kamu baik)\b/;
var FETCH_VERB = /\b(ambil\w*|beli\w*|cariin|carikan|mintakan)\b/;
var GREET = /\b(halo|hai|hi|hello|hei|selamat (pagi|siang|sore|malam)|apa kabar|gimana kabar|kabarmu|lagi apa|lagi ngapain|sedang apa|assalamualaikum|permisi|woi)\b/;
function norm(t){ return ' ' + String(t).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim() + ' '; }
function planReply(steps, per){
  var first = steps[0], d = first['do'];
  if (steps.length === 1){
    if (d === 'ikuti') return pick(['Oke, aku ikut!', 'Siap, aku jalan di belakangmu.']);
    if (d === 'berhenti') return pick(['Baik, aku berhenti di sini.', 'Oke, aku diam di sini.']);
    if (d === 'hadiah') return pick(['Nih, ada sesuatu buatmu!', 'Hmm, aku punya sesuatu. Ambil ya.']);
    if (d === 'pergi'){
      var tj = String(first.tujuan || ''), lab = tj === 'aku' ? 'tempatmu' : tj === 'mart' ? 'Mart' : tj === 'kasino' ? 'Kasino' : tj;
      return pick(['Oke, aku ke ' + lab + ' dulu.', 'Baik, aku jalan ke ' + lab + '.']);
    }
    if (d === 'ajari') return 'Oke, aku pelajari "' + first.nama + '".';
    if (d === 'ingat') return 'Baik, aku ingat.';
    if (d === 'tidur') return 'Oke, aku tidur dulu.';
    if (d === 'ancam') return pick(['Oke, kugertak dia.', 'Baik, kuberi dia peringatan.']);
    if (d === 'pukul') return pick(['Oke, kuhajar dia!', 'Baik, kuberi dia pelajaran.']);
    if (d === 'damai') return pick(['Oke, aku coba berdamai.', 'Baik, kuajak dia baikan.']);
  }
  var l = legacyOf(steps);
  if (l.type === 'fetch' && l.item) return pick(['Oke, aku belikan ' + GT.itemName(l.item) + ' dulu ya.', 'Siap! ' + GT.itemName(l.item) + ' segera datang.']);
  var txt = steps.map(function(s){ return GT.agent.stepLabel(s).toLowerCase(); }).join(', lalu ');
  return 'Siap! ' + clampStr(txt.charAt(0).toUpperCase() + txt.slice(1), 200) + '.';
}
function localBrain(text, c){
  c = c || {};
  var s = norm(text), name = c.name || 'NPC', aff = c.aff == null ? 40 : c.aff, per = period(c.hour == null ? 12 : c.hour);
  var out = { reply:'', plan:[], notes:[], refuse:false, action:{ type:'none', target:null, item:null }, affinity_delta:0 };
  function say(a){ out.reply = pick(a); return out; }
  if (RUDE.test(s)){ out.affinity_delta = -2; return say(['Kasar banget sih!', 'Aku nggak suka dikatai begitu.', 'Hei, yang sopan dong.']); }
  if (POLITE.test(s)) out.affinity_delta = 1;
  var pr = GT.agent.parseText(text, { npc:c.npcObj || null });
  if (pr.steps.length){
    out.plan = pr.steps; out.action = legacyOf(pr.steps);
    out.reply = planReply(pr.steps, per);
    if (pr.skipped.length) out.notes.push('dilewati: ' + pr.skipped.join('; '));
    return out;
  }
  if (FETCH_VERB.test(s)) return say(['Mau diambilkan apa? Misalnya roti, apel, susu, atau kue.', 'Barang apa yang kamu mau?']);
  if (/\b(makasih|terima kasih|terimakasih|thanks|thx)\b/.test(s)) return say(['Sama-sama!', 'Sama-sama, senang membantu.']);
  if (/\b(siapa kamu|namamu|siapa namamu)\b/.test(s)) return say(['Aku ' + name + '. Senang berteman denganmu.']);
  if (GREET.test(s)){
    if (/kabar/.test(s)) return say(aff >= 60 ? ['Kabarku baik, apalagi ketemu kamu!', 'Baik-baik saja! Kamu sendiri?'] : ['Baik-baik saja.', 'Lumayan. Kamu?']);
    if (/lagi (apa|ngapain)|sedang apa/.test(s)) return say(['Lagi jalan-jalan santai saja.', 'Lagi menikmati ' + per + ' ini.']);
    return say(aff >= 60 ? ['Halo ' + playerName() + '! Selamat ' + per + '.', 'Hai! Senang kamu datang.'] : aff < 30 ? ['Hm.', 'Ada apa?'] : ['Halo. Selamat ' + per + '.', 'Hai, ' + playerName() + '.']);
  }
  return say(aff < 30 ? ['Hm.', 'Terserah.'] : ['Hmm, aku kurang paham. Coba "ikut aku", "ke mart lalu beli roti", atau "ambilkan roti".', 'Maksudnya apa ya? Aku bisa ikut, pergi ke suatu tempat, beli barang, atau beberapa langkah sekaligus.']);
}

/* ------------------------------------------------------------------ persona + prompt */
var TRAITS = ['ramah dan hangat', 'santai dan suka bercanda', 'pendiam tapi perhatian', 'penasaran dan banyak bicara', 'tenang dan bijak'];
function roleOf(npc){
  var k = GT.npcKey(npc), w = GT.world, m;

}
function affLabel(a){ return a < 30 ? 'rendah (kamu tidak mau membantu)' : a < 60 ? 'sedang (kadang menolak tugas jalan/ambil barang)' : 'tinggi (senang membantu)'; }
function buildSystem(npc, aff, dev, auto){

    auto ? 'Sekarang kamu bebas melakukan apa saja seperti pemain asli. Sekarang pukul ' + (GT.time && GT.time.hhmm || '--:--') + ' (' + period(curHour()) + ').'
         : 'Kamu sedang mengobrol dengan pemain bernama ' + playerName() + '. Sekarang pukul ' + (GT.time && GT.time.hhmm || '--:--') + ' (' + period(curHour()) + ').',
    'Tingkat kedekatanmu dengan ' + playerName() + ': ' + aff + '/100, ' + affLabel(aff) + '.',
    'Kamu punya dompet dan tas sendiri; membeli memakai uangmu sendiri. Jangan merencanakan pembelian yang melebihi dompetmu.',
    'Jawab singkat (maks 2 kalimat), Bahasa Indonesia santai, tetap dalam karakter. Jangan menyebut dirimu AI atau model.',
    'Barang di Mart: ' + items + '.',
    'Aksi yang tersedia (hanya pakai aksi ini, maks ' + 8 + ' langkah, berurutan):\n' + GT.agent.promptActions(),
    'Keadaan sekarang (JSON): ' + JSON.stringify(obs),
    'Hubunganmu dengan warga lain bisa baik atau buruk (lihat "relasi"). Kamu boleh mengancam/memukul (aksi ancam/pukul) hanya orang yang kamu benci; jangan menyakiti orang yang kamu sukai. Malam hari (21:00-05:59) kamu lebih suka di rumah.',
    'Kalau kedekatan di bawah 30 kamu menolak semua permintaan; antara 30 dan 59 kadang menolak tugas jalan/beli; 60 ke atas senang membantu. Jika pemain kasar, beri affinity_delta negatif. Menolak: plan kosong.',
    'Balas HANYA dengan satu objek JSON, tanpa teks lain, persis dengan format: {"reply":"...","plan":[{"do":"pergi","tujuan":"mart"},{"do":"beli","item":"roti","n":2},{"do":"pergi","tujuan":"aku"},{"do":"beri","item":"roti","n":2,"kepada":"aku"}],"affinity_delta":-2..2}. plan boleh [] bila hanya mengobrol.'

/* ------------------------------------------------------------------ provider: error handling */
function fail(code, msg){ var e = new Error(msg || code); e.soulCode = code; return e; }
function sanitize(m){
  m = String(m == null ? '' : m);
  if (custom.key) m = m.split(custom.key).join('***');
  return m.replace(/Bearer\s+\S+/gi, 'Bearer ***').slice(0, 160);
}
function classify(e){
  if (e && e.soulCode) return e.soulCode;
  var s = ((e && (e.code || (e.error && e.error.code) || e.name)) || '') + ' ' + ((e && e.message) || e || '');
  s = String(s).toLowerCase();
  if (/rate_limited|rate limit|ratelimit|too many/.test(s)) return 'rate_limited';
  if (/not_granted|notgranted|not granted|permission|denied|consent/.test(s)) return 'not_granted';
  if (/abort/.test(s)) return 'aborted';
  return 'error';
}
function withAbort(p, ctrl){
  return new Promise(function(resolve, reject){
    function onAbort(){ reject(fail(ctrl.timedOut ? 'timeout' : 'aborted', ctrl.timedOut ? 'waktu habis' : 'dibatalkan')); }
    if (ctrl.signal.aborted) return onAbort();
    ctrl.signal.addEventListener('abort', onAbort, { once:true });
    Promise.resolve(p).then(resolve, reject);
  });
}
function sleep(ms, ctrl){
  return withAbort(new Promise(function(res){ setTimeout(res, ms); }), ctrl);
}
function historyMsgs(soul){
  var h = soul.hist.slice(-HIST_MAX);
  while (h.length && h[0].role !== 'user') h.shift();
  return h;
}

async function callClaude(soul, npc, text, aff, ctrl){
  var cap = await withAbort(GT.cap('sample'), ctrl);
  var fn = typeof cap === 'function' ? cap : (cap && typeof cap.sample === 'function' ? cap.sample.bind(cap) : null);
  if (!fn) throw fail('unavailable', 'Tidak tersedia di tampilan ini');
  var sys = buildSystem(npc, aff, ctrl.dev), h = historyMsgs(soul), msgs = [];
  h.forEach(function(m){ msgs.push({ role:m.role, content:m.content }); });
  msgs.push({ role:'user', content:text });
  msgs[0] = { role:'user', content:sys + '\n\nPesan pemain:\n' + msgs[0].content };   // memoryless: persona + format ikut di pesan pertama
  var res;
  var tools = soulTools(npc);
  try { res = await withAbort(fn(msgs, { modelTier:'quick', signal:ctrl.signal, tools:tools }), ctrl); }
  catch(e){
    var c0 = classify(e);
    if (c0 === 'error' && !ctrl.signal.aborted){      // runtime tanpa dukungan tools: coba lagi tanpa tools
      try { res = await withAbort(fn(msgs, { modelTier:'quick', signal:ctrl.signal }), ctrl); }
      catch(e2){ var c2 = classify(e2); throw fail(c2, sanitize(e2 && e2.message)); }
    } else throw fail(c0, sanitize(e && e.message));
  }
  var out = typeof res === 'string' ? res : (res && (res.text != null ? res.text : res.content));
  if (out == null) throw fail('format', 'Balasan Claude kosong');
  return parseBrain(out);
}

async function callCustom(soul, npc, text, aff, ctrl){
  var url = custom.url;
  if (!urlOk(url)) throw fail('config', 'URL endpoint belum diatur atau tidak valid');
  var msgs = [{ role:'system', content:buildSystem(npc, aff, ctrl.dev) }];
  historyMsgs(soul).forEach(function(m){ msgs.push({ role:m.role, content:m.content }); });
  msgs.push({ role:'user', content:text });
  var headers = { 'Content-Type':'application/json' };
  if (custom.key) headers['Authorization'] = 'Bearer ' + custom.key;
  var timer = setTimeout(function(){ ctrl.timedOut = true; try { ctrl.abort(); } catch(e){} }, DELAY.net);
  try {
    var resp;
    try {
      resp = await withAbort(fetch(url, { method:'POST', headers:headers, signal:ctrl.signal, credentials:'omit', referrerPolicy:'no-referrer', cache:'no-store',
        body:JSON.stringify({ model:custom.model || 'gpt-4o-mini', messages:msgs, temperature:0.7 }) }), ctrl);
    } catch(e){
      var c0 = classify(e);
      if (c0 === 'aborted' || c0 === 'timeout') throw e;
      throw fail('network', 'Koneksi ke endpoint gagal (jaringan, CORS, atau diblokir CSP). ' + sanitize(e && e.message));
    }
    if (!resp.ok){
      if (resp.status === 401 || resp.status === 403) throw fail('http', 'Kunci API ditolak (' + resp.status + ')');
      if (resp.status === 429) throw fail('http', 'Endpoint membatasi permintaan (429)');
      throw fail('http', 'Endpoint membalas status ' + resp.status);
    }
    var data;
    try { data = await withAbort(resp.json(), ctrl); } catch(e){ if (classify(e) === 'aborted' || classify(e) === 'timeout') throw e; throw fail('format', 'Balasan endpoint bukan JSON'); }
    var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (typeof content !== 'string') throw fail('format', 'Balasan endpoint tidak sesuai format OpenAI (choices[0].message.content)');
    return parseBrain(content);
  } finally { clearTimeout(timer); }
}

async function callLocal(soul, npc, text, aff, ctrl, noDelay){
  if (!noDelay && DELAY.think > 0) await sleep(DELAY.think, ctrl);
  return localBrain(text, { name:npc.name, aff:aff, hour:curHour(), npcObj:npc });
}

function urlOk(u){
  u = String(u || '').trim();
  if (/^https:\/\/[^\s/]+/i.test(u)) return true;
  return /^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?(\/|$)/i.test(u);
}

// alat baca-saja untuk Claude: lihat sekitar, cari, status saya (hasil juga sudah ada di prompt lewat observe())
function soulTools(npc){
  function def(name, desc, props, fn){
    var t = { name:name, description:desc, execute:function(input){ return fn(input || {}); } }; if (Object.keys(props).length) t.inputSchema = { type:'object', properties:props, required:Object.keys(props) }; return t;
  }
  return [
    def('lihat_sekitar', 'Lihat siapa dan apa yang ada di sekitarmu sekarang.', {}, function(){ var o = GT.agent.observe(npc); return JSON.stringify({ scene:o.scene, sekitar:o.sekitar, pemain:o.pemain, waktu:o.waktu }); }),
    def('cari', 'Cari di mana seseorang atau suatu tempat berada.', { nama:{ type:'string' } }, function(a){
      var nm = a && a.nama; var c = GT.agent.resolveChar(nm, npc);
      if (c){
        if (c.kind === 'player') return playerName() + ' (pemain) ' + (GT.scene === GT.outScene ? 'ada di luar' : sceneLabel(GT.scene)) + ', jarak sekitar ' + (Math.abs(GT.player.x - npc.x) + Math.abs(GT.player.y - npc.y)) + ' langkah.';
        var n = GT.agent.npcByKey(c.key); return n ? c.name + ' ' + sceneLabel(GT.npcScene(n)) + '.' : c.name + ' tidak terlihat.';
      }
      var pl = GT.agent.resolvePlace(nm, npc);
      return pl ? (pl.label + (pl.b ? ' pintunya di blok ' + pl.b.dx + ',' + pl.b.dy : '') + '.') : 'tidak ditemukan';
    }),
    def('status_saya', 'Lihat dompet, tas, tugas, dan ingatanmu.', {}, function(){ var o = GT.agent.observe(npc); return JSON.stringify({ dompet:o.dompet, tas:o.tas, tugas:o.tugas, ingatan:o.ingatan, keterampilan:o.keterampilan }); })
  ];
}

/* ------------------------------------------------------------------ pekerja (penjaga Mart / bandar) yang dipaksa developer pergi: kembali ke pos lewat aksi 'kerja' */
function capturePost(npc){

}
function registerPost(soul, npc, cap){

function placeAtPost(npc, p){
  if (!p.sc) return;
  try { GT.agent.cancel(npc); } catch(e){}
  if (GT.npcScene(npc) !== p.sc) GT.moveNpc(npc, p.sc, p.x, p.y);
  else if (npc.x !== p.x || npc.y !== p.y){ if (!GT.npcTeleport(npc, p.x, p.y, p.dir)) GT.moveNpc(npc, p.sc, p.x, p.y); }
  GT.npcHide(npc, false);
  npc.wander = p.wander; npc.leash = p.leash; npc.turns = p.turns; npc.follow = false;
  npc.home = { x:p.x, y:p.y }; npc.dir = p.dir; npc.wait = 1;
  npc._post = null;
}
function agentBusy(npc){ try { return GT.agent.status(npc).busy; } catch(e){ return false; } }
function sendHome(soul){
  var p = soul.post; if (!p || p.returning || p.epoch !== epoch) return;
  var npc = p.npc;
  p.returning = true; npc._post = p;
  GT.agent.run(npc, [{ 'do':'kerja' }], { source:'post' }).then(function(res){
    if (p.epoch !== epoch) return;
    if (p.returned){ if (soul.post === p) soul.post = null; return; }
    p.returning = false;
    if (!res.cancelled) p.until = (GT.time && GT.time.total || 0) + 5;
  });
}
function postTick(){
  var now = GT.time && GT.time.total || 0;
  Object.keys(souls).forEach(function(k){
    var s = souls[k], p = s.post;
    if (!p) return;
    if (p.epoch !== epoch){ s.post = null; return; }
    if (!p.returning && now >= p.until){
      if (agentBusy(p.npc) || p.npc.follow) p.until = now + 5; else sendHome(s);
    }
  });
}

/* ------------------------------------------------------------------ gerbang affinity (dipaksa di kode, berlaku untuk SELURUH rencana) */
function planClass(plan){
  var ds = plan.map(function(s){ return s['do']; });
  if (!ds.length) return 'none';
  if (ds.every(function(d){ return d === 'berhenti' || d === 'ingat' || d === 'ajari'; })) return 'free';
  if (ds.length === 1 && ds[0] === 'hadiah') return 'gift';
  if (ds.length === 1 && ds[0] === 'ikuti') return 'follow';
  return 'task';
}
function gate(npc, plan, aff){
  var c = planClass(plan);
  if (c === 'none' || c === 'free') return null;
  var mover = c !== 'gift';
  if (mover && isWorker(npc)) return { reason:'kerja', reply:'Aku lagi kerja, nggak bisa pergi.' };
  if (aff < 30) return { reason:'affinity_rendah', reply:'Aku lagi nggak mood bantu kamu.' };
  if (aff < 60 && c === 'task' && r01() < 0.5) return { reason:'acak', reply:'Hmm, lagi malas nih. Lain kali ya.' };
  return null;
}
// jam malam: tugas yang memaksa NPC keluar rumah ditolak (kecuali '#')
function nightGate(npc, plan){
  try { if (plan.length && !isWorker(npc) && GT.agent.curfewNow() && GT.agent.needsOutdoor(npc, plan)) return { reason:'jam_malam', reply:'Sudah malam, aku di rumah saja.' }; } catch(e){}
  return null;
}
// tidak mau mengancam/memukul orang yang disukai (relasi >= 20; pemain: kedekatan >= 60)
function suka(npc, plan){
  try { return GT.agent.combatGate(npc, plan); } catch(e){ return null; }
}
function planCost(plan){
  var t = 0;
  plan.forEach(function(s){ if (s['do'] === 'beli'){ var id = GT.agent.itemId(s.item), n = Math.max(1, Math.min(20, Math.floor(+s.n) || 1)); if (id) t += (Math.floor(GT.ITEMS[id].price) || 0) * n; } });
  return t;
}

/* ------------------------------------------------------------------ eksekusi rencana + replan + log obrolan */
var logs = {};          // npcKey -> [{kind,text}]  (riwayat tugas untuk obrolan)
var views = {};         // npcKey -> fn(event) bila obrolan terbuka
function pushLog(k, kind, text){
  var a = logs[k] || (logs[k] = []);
  a.push({ kind:kind, text:clampStr(text, 160) });
  if (a.length > 40) a.splice(0, a.length - 40);
}
function onAgentEvent(ev){
  var k = ev.key; if (!k) return;
  if (ev.type === 'plan'){ pushLog(k, 'plan', JSON.stringify(ev.steps)); }
  else if (ev.type === 'step' && ev.state !== 'run'){ pushLog(k, ev.state === 'ok' ? 'ok' : ev.state === 'fail' ? 'fail' : 'cancel', ev.note || ev.label); }
  else if (ev.type === 'log'){ pushLog(k, 'say', ev.text); }
  else if (ev.type === 'end'){
    var s = souls[k];
    if (ev.source === 'player' && !ev.cancelled && ev.ok && !views[k]) GT.toast((ev.npc && ev.npc.name || 'NPC') + ': tugas selesai.');
    else if (ev.source === 'player' && !ev.cancelled && !ev.ok && !views[k] && ev.failed) GT.toast((ev.npc && ev.npc.name || 'NPC') + ': gagal, ' + clampStr(ev.failed.note, 60));
  }
  if (views[k]) { try { views[k](ev); } catch(e){} }
}
function startPlan(soul, npc, plan, forced, replanned){
  var cap = (forced && isWorker(npc) && planClass(plan) !== 'free') ? capturePost(npc) : null;
  var p = GT.agent.run(npc, plan, { source:'player', epoch:epoch, forced:!!forced });
  if (cap) registerPost(soul, npc, cap);
  var ep = epoch;
  p.then(function(res){
    if (ep !== epoch || !res) return;
    if (res.failed && !res.cancelled && !res.busy){
      if (soul.provider !== 'local' && !replanned) return replan(soul, npc, plan, res, forced);
      GT.npcSay(npc, 'Maaf, gagal: ' + clampStr(res.failed.note, 60));
    }
    var cur = GT.agent.status(npc);
    if (soul.post && !cur.busy && !res.cancelled && !npc.follow) sendHome(soul);
    else if (soul.post && !cur.busy && res.cancelled && soul.post.epoch === epoch && !soul.post.returning) { /* dibatalkan: postTick akan memulangkan */ }
  });
  return p;
}
async function replan(soul, npc, plan, res, forced){
  var ep = epoch, ctrl = new AbortController();
  ctrl.timedOut = false; ctrl.userAbort = false; ctrl.dev = !!forced;
  try {
    var txt = '[SISTEM] Rencana gagal di langkah ' + (res.failed.i + 1) + ' (' + GT.agent.stepLabel(res.failed.step) + '): ' + res.failed.note + '. Buat rencana baru untuk melanjutkan atau memperbaikinya, atau plan kosong bila mustahil. Dompetmu sekarang ' + GT.agent.wallet(npc) + ' koin.';
    var br = await brainCall(soul, npc, txt, GT.getAffinity(npc), ctrl, true);
    if (ep !== epoch) return;
    if (br.reply) GT.npcSay(npc, br.reply);
    var np = br.plan.length ? GT.agent.normalizePlan(br.plan).steps : [];
    if (np.length && !GT.agent.status(npc).busy){ pushLog(npc ? GT.npcKey(npc) : '', 'sys', 'Rencana diperbarui.'); startPlan(soul, npc, np, forced, true); }
    else GT.npcSay(npc, 'Maaf, gagal: ' + clampStr(res.failed.note, 60));
  } catch(e){
    GT.npcSay(npc, 'Maaf, gagal: ' + clampStr(res.failed.note, 60));
  }
}
function brainCall(soul, npc, text, aff, ctrl, noFallbackMsg){
  var p = soul.provider === 'claude' ? callClaude(soul, npc, text, aff, ctrl) : soul.provider === 'custom' ? callCustom(soul, npc, text, aff, ctrl) : callLocal(soul, npc, text, aff, ctrl, true);
  return Promise.resolve(p).catch(function(e){
    if (soul.provider === 'local') throw e;
    return callLocal(soul, npc, text, aff, ctrl, true);
  });
}

/* ------------------------------------------------------------------ ask() */
function emptyRes(soul, extra){
  var r = { ok:false, provider:soul ? soul.provider : 'local', usedProvider:soul ? soul.provider : 'local', fellBack:false, reply:'',
    action:{ type:'none', target:null, item:null }, requested:{ type:'none', target:null, item:null }, plan:[], affinity_delta:0, refused:false, executed:false, note:'' };
  Object.keys(extra || {}).forEach(function(k){ r[k] = extra[k]; });
  return r;
}
function fallbackNote(provider, e, code){
  var who = provider === 'claude' ? 'Claude' : 'Endpoint kustom';
  if (code === 'unavailable') return 'Claude: Tidak tersedia di tampilan ini. Memakai otak lokal untuk pesan ini.';
  if (code === 'not_granted') return 'Claude: Tidak tersedia (izin belum diberikan). Memakai otak lokal untuk pesan ini.';
  if (code === 'timeout') return who + ' terlalu lama menjawab. Memakai otak lokal untuk pesan ini.';
  var m = e && e.soulCode ? sanitize(e.message) : 'terjadi kesalahan';
  return who + ' gagal: ' + m + ' Memakai otak lokal untuk pesan ini.';
}

function ask(npc, text){
  if (!npc) return Promise.resolve(emptyRes(null, { error:'no_npc' }));
  text = String(text == null ? '' : text).replace(/\s+/g, ' ').trim().slice(0, MSG_MAX);
  if (!text) return Promise.resolve(emptyRes(souls[GT.npcKey(npc)], { error:'kosong' }));
  var soul = ensureSoul(npc);
  if (soul.ctrl) return Promise.resolve(emptyRes(soul, { error:'busy', busy:true }));
  var cmd = parseDev(text), forced = false, hint = '';
  if (cmd){
    if (devEnabled()) forced = true;
    else if (!devHinted){ devHinted = true; hint = DEV_HINT; }
  }
  return askAsync(soul, npc, forced ? cmd : text, forced, hint);
}
async function askAsync(soul, npc, text, forced, hint){
  var ctrl = soul.ctrl = new AbortController();
  ctrl.timedOut = false; ctrl.userAbort = false; ctrl.dev = !!forced;
  var ep = epoch, aff = GT.getAffinity(npc), res = emptyRes(soul, { text:text, affinity_before:aff, forced:!!forced, hint:hint || '' });
  try {
    var br;
    try {
      if (soul.provider === 'claude') br = await callClaude(soul, npc, text, aff, ctrl);
      else if (soul.provider === 'custom') br = await callCustom(soul, npc, text, aff, ctrl);
      else br = await callLocal(soul, npc, text, aff, ctrl);
    } catch(e){
      var code = classify(e);
      if (ctrl.userAbort || (code === 'aborted' && !ctrl.timedOut)) return emptyRes(soul, { aborted:true, error:'aborted' });
      if (code === 'rate_limited'){
        GT.toast('Terlalu cepat, coba lagi sebentar.');
        return emptyRes(soul, { error:'rate_limited', note:'Claude sedang membatasi permintaan. Coba lagi sebentar.', text:text });
      }
      if (soul.provider === 'local') throw e;
      res.fellBack = true; res.usedProvider = 'local'; res.note = fallbackNote(soul.provider, e, code); res.error = code;
      br = await callLocal(soul, npc, text, aff, ctrl, true);
    }
    if (ctrl.userAbort || ctrl.signal.aborted && !ctrl.timedOut) return emptyRes(soul, { aborted:true, error:'aborted' });
    if (ep !== epoch) return emptyRes(soul, { aborted:true, error:'dunia_berubah' });
    // --- adjudikasi (selalu di kode, bukan di prompt)
    var plan = br.plan || [], reply = br.reply, act = legacyOf(plan);
    if (br.refuse && !plan.length) act = { type:'refuse', target:null, item:null };
    res.requested = { type:act.type, target:act.target, item:act.item };
    var delta = br.affinity_delta | 0;
    var g = forced ? null : (gate(npc, plan, aff) || nightGate(npc, plan) || suka(npc, plan));
    if (forced){
      // '#': gerbang affinity / penolakan acak / "lagi kerja" dilewati; otak menolak -> parser lokal; tak ada -> "Siap, developer."
      delta = 0;
      if (!plan.length){
        var lb = localBrain(text, { name:npc.name, aff:aff, hour:curHour(), npcObj:npc });
        if (lb.plan.length){ plan = lb.plan; act = legacyOf(plan); reply = lb.reply; res.devOverride = true; }
        else { act = { type:'none', target:null, item:null }; reply = 'Siap, developer.'; }
      }
    } else if (g){
      res.refused = true; res.refuseReason = g.reason;
      reply = g.reply; plan = []; act = { type:'refuse', target:null, item:null };
    } else if (act.type === 'refuse'){
      res.refused = true; res.refuseReason = 'otak';
      if (!reply) reply = 'Aku lagi nggak mood bantu kamu.';
    }
    // --- eksekusi
    var ex = { executed:false };
    if (!res.refused && plan.length){
      var cost = planCost(plan);
      if (cost > GT.agent.wallet(npc)){
        ex = { executed:false, note:'koin_kurang', reply:'Uangku belum cukup (' + cost + ' koin, dompetku ' + GT.agent.wallet(npc) + ').' };
      } else if (planClass(plan) === 'gift' && GT.agent.giftedToday(npc)){
        ex = { executed:false, note:'sudah_hari_ini', reply:'Hari ini sudah kuberi hadiah, besok lagi ya.' };
      } else {
        npc._lastGift = null;
        startPlan(soul, npc, plan, forced, false);
        ex = { executed:true, sys:'Rencana: ' + GT.agent.describe(plan) };
        if (act.type === 'gift' && npc._lastGift) act.item = npc._lastGift;
      }
    }
    if (ex.reply) reply = ex.reply;
    res.executed = !!ex.executed; res.execNote = ex.note || ''; res.sys = ex.sys || ''; res.noop = false;
    res.plan = res.refused ? [] : plan;
    res.requested = res.requested.type === 'none' && act.type !== 'none' ? { type:act.type, target:act.target, item:act.item } : res.requested;
    res.reply = reply || '...';
    res.action = act;
    // --- affinity
    if (delta){ GT.addAffinity(npc, delta); }
    res.affinity_delta = delta; res.affinity = GT.getAffinity(npc);
    res.ok = true;
    // --- riwayat (konten asisten = hasil akhir)
    soul.hist.push({ role:'user', content:text });
    soul.hist.push({ role:'assistant', content:JSON.stringify({ reply:res.reply, plan:res.plan, affinity_delta:delta }) });
    if (soul.hist.length > HIST_MAX * 2) soul.hist.splice(0, soul.hist.length - HIST_MAX * 2);
    GT.npcSay(npc, res.reply);
    return res;
  } catch(e){
    return emptyRes(soul, { error:'internal', note:sanitize(e && e.message) });
  } finally {
    if (soul.ctrl === ctrl) soul.ctrl = null;
  }
}
function abortSoul(soul){
  var c = soul && soul.ctrl;
  if (c){ c.userAbort = true; try { c.abort(); } catch(e){} }
}

/* ------------------------------------------------------------------ hook ke agen: rencana mandiri (LLM) dan balasan NPC-ke-NPC */
function llmCtrl(ms){
  var c = new AbortController(); c.timedOut = false; c.userAbort = false; c.dev = false;
  var t = setTimeout(function(){ c.timedOut = true; try { c.abort(); } catch(e){} }, ms || 20000);
  c.done = function(){ clearTimeout(t); };
  return c;
}
async function autoPlanFor(npc){
  var s = souls[GT.npcKey(npc)]; if (!s || s.provider === 'local') return null;
  var tmp = { provider:s.provider, hist:[], name:s.name }, c = llmCtrl(25000);
  try {
    var br = await brainCall(tmp, npc, 'Apa yang mau kamu lakukan sekarang? Pilih satu rencana singkat (1-4 langkah) yang cocok dengan waktu, wataknya, dan dompetmu. Akhiri dengan lapor bila ada hasil yang perlu diketahui ' + playerName() + '.', GT.getAffinity(npc), c, true);
    return br.plan && br.plan.length ? br.plan : null;
  } catch(e){ return null; } finally { c.done(); }
}
async function replyToNpc(tn, fromName, msg, signal){
  var s = souls[GT.npcKey(tn)];
  if (!s) return '';
  if (s.provider === 'local') return localBrain(msg, { name:tn.name, aff:GT.getAffinity(tn), hour:curHour(), npcObj:tn }).reply;
  var tmp = { provider:s.provider, hist:[], name:s.name }, c = llmCtrl(15000);
  if (signal) signal.addEventListener('abort', function(){ try { c.abort(); } catch(e){} }, { once:true });
  try {
    var br = await brainCall(tmp, tn, fromName + ' berkata kepadamu: "' + clampStr(msg, 140) + '". Balas singkat saja (plan harus []).', GT.getAffinity(tn), c, true);
    return br.reply || '';
  } catch(e){ return ''; } finally { c.done(); }
}

/* ------------------------------------------------------------------ UI: chat */

function bagText(npc){

}
function openChat(npc){
  if (!npc) return null;
  var soul = ensureSoul(npc), key = soul.key;
  if (chats[key] && chats[key].isOpen()) return chats[key];
  injectCss();
  var wrap = el('div'), head = el('div', 'sl-head'), tagH = el('span'), tagP = el('span', 'sl-tag');
  head.appendChild(tagH); head.appendChild(tagP);
  var wal = el('div', 'sl-wal'); wal.setAttribute('data-wallet', '1');
  var log = el('div', 'sl-log'); log.setAttribute('role', 'log'); log.setAttribute('aria-live', 'polite'); log.setAttribute('aria-label', 'Percakapan');

  input.placeholder = 'Ketik pesan, mis. "ke mart lalu beli roti"'; input.setAttribute('aria-label', 'Pesan untuk ' + npc.name); input.setAttribute('data-autofocus', '');
  wrap.appendChild(head); wrap.appendChild(wal); wrap.appendChild(log); wrap.appendChild(status); wrap.appendChild(input);
  var locked = false, closeTimer = 0, h, planBox = null, planRows = [];
  function addLine(kind, text, dev){
    var d = el('div', 'sl-m ' + kind);
    if (dev){ var tg = el('span', 'sl-dev', 'DEV'); tg.setAttribute('data-dev', '1'); d.appendChild(tg); d.setAttribute('data-dev', '1'); }
    d.appendChild(document.createTextNode(text)); log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }
  function refreshHead(){
    tagH.textContent = hearts(GT.getAffinity(npc)) + ' ' + GT.getAffinity(npc);
    tagP.textContent = 'Otak: ' + PNAME[soul.provider];
    wal.textContent = bagText(npc);
    var cb = h && h.btn('batal'); if (cb) cb.disabled = !GT.agent.status(npc).busy;
  }
  function setBusy(b){
    status.textContent = b ? 'Berpikir…' : '';
    var sb = h && h.btn('send'); if (sb) sb.disabled = b || locked;
    input.readOnly = b || locked;
  }
  // daftar tugas (checklist) yang tercentang langsung
  function buildPlan(labels, states){
    planBox = el('div', 'sl-m sys sl-plan'); planBox.setAttribute('data-plan', '1');
    planBox.appendChild(el('div', 'sl-plan-t', 'Tugas ' + npc.name + ':'));
    planRows = labels.map(function(lb, i){
      var row = el('div', 'sl-step'), g = el('span', 'sl-g', GLYPH[(states && states[i] && states[i].state) || 'wait']), t = el('span', null, lb);

    });
    log.appendChild(planBox); log.scrollTop = log.scrollHeight;
  }
  function setStep(i, state, note){
    var row = planRows[i]; if (!row) return;
    row.setAttribute('data-state', state);
    row.firstChild.textContent = GLYPH[state] || '○';
    var old = row.querySelector('.sl-note'); if (old) old.remove();
    if (note) row.appendChild(el('span', 'sl-note', ' — ' + note));
    log.scrollTop = log.scrollHeight;
